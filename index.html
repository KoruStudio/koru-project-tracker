/* ---------- Archivo ---------- */
function serialize(){
  return JSON.stringify({app:APP, version:VERSION, updatedAt:data.updatedAt || now(), clients:data.clients}, null, 2);
}
let saveTimer = null;
function scheduleSave(){
  if (gh.cfg){ clearTimeout(saveTimer); if (!gh.error) saveTimer = setTimeout(ghSave, 1500); return; }
  if (!ui.handle || !ui.canAutosave) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    writeToHandle().catch(err => {
      ui.canAutosave = false;
      renderSide();
      toast('No se pudo guardar en «' + ui.fileName + '» (' + err.message + '). Pulsa Guardar para intentarlo de nuevo.');
    });
  }, 500);
}
async function writeToHandle(){
  const target = rev;
  const text = serialize();
  ui.saving = true; renderSide();
  try{
    const w = await ui.handle.createWritable();
    await w.write(text);
    await w.close();
    savedRev = target;
    ui.savedAt = new Date();
    ui.downloaded = false;
  } finally {
    ui.saving = false;
    renderSide();
  }
  if (rev !== savedRev) scheduleSave();
}
async function ensureWritePermission(handle){
  const opts = {mode:'readwrite'};
  if (handle.queryPermission && await handle.queryPermission(opts) === 'granted') return;
  if (handle.requestPermission && await handle.requestPermission(opts) === 'granted') return;
  throw new Error('no se dio permiso para escribir en el archivo');
}
async function saveNow(){
  if (!data) return;
  if (gh.cfg){ if (gh.error === 'Hay otra versión en GitHub'){ gh.error = null; await resolveConflict(); } else { gh.error = null; await ghSave(); } return; }
  if (disk.save){
    try{
      if (!ui.handle){
        ui.handle = await window.showSaveFilePicker({suggestedName: ui.fileName || DEFAULT_NAME, types: FILE_TYPES});
        ui.fileName = ui.handle.name;
      }
      await ensureWritePermission(ui.handle);
      ui.canAutosave = true;
      clearTimeout(saveTimer);
      await writeToHandle();
      return;
    } catch(err){
      if (err && err.name === 'AbortError'){ renderSide(); return; }
      if (err && (err.name === 'SecurityError' || err.name === 'TypeError' || err.name === 'NotAllowedError')) disk.save = false;
      toast('No se pudo guardar directamente (' + (err && err.message || err) + '). Se descargó una copia en su lugar.');
    }
  }
  download();
}
function download(){
  const blob = new Blob([serialize()], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = ui.fileName || DEFAULT_NAME;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  savedRev = rev;
  ui.savedAt = new Date();
  ui.downloaded = true;
  if (!ui.fileName) ui.fileName = DEFAULT_NAME;
  renderSide();
}
function normalize(raw){
  if (!raw || typeof raw !== 'object' || !Array.isArray(raw.clients))
    throw new Error('no tiene la estructura de un archivo de seguimiento (falta la lista de clientes)');
  return {
    app:APP, version:VERSION, updatedAt: raw.updatedAt || now(),
    clients: raw.clients.map(c => ({
      id: c.id || uid(),
      name: String(c.name || 'Cliente sin nombre'),
      emoji: c.emoji ? firstGrapheme(c.emoji) : '',
      collapsed: !!c.collapsed,
      projects: (Array.isArray(c.projects) ? c.projects : []).map(p => ({
        id: p.id || uid(),
        name: String(p.name || 'Proyecto sin nombre'),
        createdAt: p.createdAt || now(),
        links: (Array.isArray(p.links) ? p.links : []).filter(l => l && l.url).map(l => ({
          id: l.id || uid(), url: String(l.url), title: String(l.title || hostOf(l.url))
        })),
        tasks: (Array.isArray(p.tasks) ? p.tasks : []).map(t => ({
          id: t.id || uid(),
          text: String(t.text || 'Tarea sin texto'),
          done: !!t.done,
          urgent: !!t.urgent,
          createdAt: t.createdAt || now(),
          doneAt: t.doneAt || null
        }))
      }))
    }))
  };
}
function readText(file){
  if (typeof file.text === 'function') return file.text();
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(new Error('el navegador no pudo leerlo' + (r.error ? ': ' + r.error.message : '')));
    r.readAsText(file);
  });
}
async function loadFile(file, handle){
  let parsed;
  try{
    parsed = normalize(JSON.parse(await readText(file)));
  } catch(err){
    toast('No se pudo leer «' + file.name + '»: ' + err.message + '. Comprueba que sea un archivo guardado con esta herramienta.');
    return;
  }
  clearTimeout(saveTimer);
  data = parsed; rev = 0; savedRev = 0;
  ui.fileName = file.name; ui.handle = handle || null; ui.canAutosave = false;
  ui.savedAt = null; ui.downloaded = false; ui.filter = 'all';
  ui.clientId = null; ui.projectId = null; ui.newClientOpen = false; ui.newEmoji = '';
  ui.expanded.clear();
  if (handle){
    try{ await ensureWritePermission(handle); ui.canAutosave = true; }
    catch(err){ /* Sin permiso todavía: se pide al pulsar Guardar, y el panel lo indica. */ }
  }
  render();
}
async function confirmDiscard(){
  return !isDirty() || confirmDialog('Hay cambios sin guardar', 'Si continúas, los cambios que no guardaste se pierden.', 'Continuar sin guardar');
}
async function openFile(){
  if (!await confirmDiscard()) return;
  if (disk.open){
    let handle;
    try{ [handle] = await window.showOpenFilePicker({types: FILE_TYPES, multiple:false}); }
    catch(err){ if (err && err.name === 'AbortError') return; disk.open = false; }
    if (handle){ await loadFile(await handle.getFile(), handle); return; }
  }
  $('#fileInput').click();
}
async function startNew(){
  if (!await confirmDiscard()) return;
  clearTimeout(saveTimer);
  data = {app:APP, version:VERSION, clients:[]};
  rev = 0; savedRev = 0;
  Object.assign(ui, {clientId:null, projectId:null, filter:'all', handle:null, fileName:null, canAutosave:false, savedAt:null, downloaded:false, newClientOpen:false, newEmoji:''});
  ui.expanded.clear();
  render();
  $('#newClient').focus();
}

/* ---------- Diálogo y aviso ---------- */
/* Devuelve true (aceptar), false (segunda opción) o null (cerrado con Escape). */
function confirmDialog(title, text, okLabel, cancelLabel){
  const d = $('#dlg');
  if (typeof d.showModal !== 'function') return Promise.resolve(window.confirm(title + '\n\n' + text));
  return new Promise(resolve => {
    $('#dlgTitle').textContent = title;
    $('#dlgText').textContent = text;
    $('#dlgOk').textContent = okLabel;
    $('#dlgCancel').textContent = cancelLabel || 'Cancelar';
    const finish = v => { d.close(); resolve(v); };
    $('#dlgOk').onclick = () => finish(true);
    $('#dlgCancel').onclick = () => finish(cancelLabel ? false : null);
    d.oncancel = e => { e.preventDefault(); finish(null); };
    d.showModal();
    $('#dlgCancel').focus();
  });
}
let toastTimer = null;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 4500);
}

/* ---------- Eventos: panel izquierdo ---------- */
$('#tree').addEventListener('click', e => {
  const tg = e.target.closest('[data-toggle]');
  if (tg){ const c = findClient(tg.dataset.toggle); if (c){ setCollapsed(c, !c.collapsed); updateToggleAll(); } return; }
  const add = e.target.closest('[data-add-project]');
  if (add){ addProject(add.dataset.addProject, ''); return; }
  const row = e.target.closest('[data-client]');
  if (!row) return;
  if (Date.now() < suppressClickUntil) return;
  ui.clientId = row.dataset.client;
  ui.projectId = row.dataset.project || null;
  ui.filter = 'all';
  ui.linkFormFor = null;
  render();
});

/* Reordenar clientes arrastrando; alternativa con Alt + ↑ ↓ o los botones de la vista de cliente */
let cdrag = null, suppressClickUntil = 0;
$('#tree').addEventListener('pointerdown', e => {
  const main = e.target.closest('.tree-main');
  if (!main || e.button !== 0 || !data || data.clients.length < 2) return;
  cdrag = {id: main.dataset.client, startY: e.clientY, active:false, beforeId: undefined};
});
window.addEventListener('pointermove', e => {
  if (!cdrag) return;
  if (!cdrag.active){
    if (Math.abs(e.clientY - cdrag.startY) < 6) return;
    cdrag.active = true;
    cdrag.box = document.querySelector(`[data-box="${cdrag.id}"]`);
    cdrag.box.classList.add('dragging');
    document.body.classList.add('is-dragging');
  }
  e.preventDefault();
  const tree = $('#tree');
  const boxes = [...tree.querySelectorAll('.tree-client')];
  const top = tree.getBoundingClientRect().top;
  let beforeId = null, y = null;
  for (const b of boxes){
    const r = b.getBoundingClientRect();
    // Se compara con la mitad de la fila del cliente, no de todo su bloque.
    if (e.clientY < r.top + Math.min(r.height, 38) / 2){ beforeId = b.dataset.box; y = r.top - top; break; }
  }
  if (beforeId === null) y = boxes[boxes.length - 1].getBoundingClientRect().bottom - top;
  cdrag.beforeId = beforeId;
  const line = tree.querySelector('.tree-line');
  line.style.top = (y - 3) + 'px';
  line.style.display = 'block';
});
function endClientDrag(commit){
  if (!cdrag) return;
  const d = cdrag; cdrag = null;
  if (!d.active) return;
  suppressClickUntil = Date.now() + 300;
  document.body.classList.remove('is-dragging');
  d.box.classList.remove('dragging');
  const line = $('#tree .tree-line'); if (line) line.style.display = 'none';
  if (!commit || d.beforeId === undefined || d.beforeId === d.id) return;
  const before = data.clients.map(c => c.id).join();
  const from = data.clients.findIndex(c => c.id === d.id);
  const [moved] = data.clients.splice(from, 1);
  const to = d.beforeId === null ? data.clients.length : data.clients.findIndex(c => c.id === d.beforeId);
  data.clients.splice(to, 0, moved);
  if (data.clients.map(c => c.id).join() !== before) changed();
}
window.addEventListener('pointerup', () => endClientDrag(true));
window.addEventListener('pointercancel', () => endClientDrag(false));
$('#tree').addEventListener('keydown', e => {
  const main = e.target.closest('.tree-main');
  if (!main || !e.altKey || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
  e.preventDefault();
  moveClient(main.dataset.client, e.key === 'ArrowUp' ? -1 : 1);
  focusSel(`.tree-main[data-client="${main.dataset.client}"]`);
});
$('#toggleAll').addEventListener('click', () => {
  if (!data) return;
  const collapse = data.clients.some(c => c.projects.length && !c.collapsed);
  data.clients.forEach(c => { if (c.projects.length) setCollapsed(c, collapse); });
  updateToggleAll();
});
$('#newClientBtn').addEventListener('click', openNewClient);
$('#cancelClient').addEventListener('click', closeNewClient);
$('#addClient').addEventListener('click', addClient);
$('#newClient').addEventListener('keydown', e => {
  if (e.key === 'Enter') addClient();
  else if (e.key === 'Escape' && data && data.clients.length) closeNewClient();
});
$('#newClientEmoji').addEventListener('click', e => {
  openEmoji(e.currentTarget, ui.newEmoji, em => { ui.newEmoji = em; renderNewClient(); $('#newClient').focus(); });
});

/* ---------- Eventos: lienzo ---------- */
const center = $('#center');

center.addEventListener('click', e => {
  const exp = e.target.closest('[data-expand]');
  if (exp){
    const id = exp.dataset.expand;
    const open = !ui.expanded.has(id);
    open ? ui.expanded.add(id) : ui.expanded.delete(id);
    const card = exp.closest('.pcard');
    card.classList.toggle('open', open);
    exp.setAttribute('aria-expanded', String(open));
    exp.title = open ? 'Ocultar tareas' : 'Ver tareas';
    return;
  }
  const el = e.target.closest('[data-act],[data-open],[data-filter]');
  if (!el) return;
  const {c} = current();
  if (el.dataset.open){
    ui.projectId = el.dataset.open; ui.filter = 'all'; ui.linkFormFor = null;
    if (c) c.collapsed = false;
    render(); focusSel('#newTask'); return;
  }
  if (el.dataset.filter){ ui.filter = el.dataset.filter; renderCenter(); focusSel(`[data-filter="${ui.filter}"]`); return; }
  const li = el.closest('.task');
  const id = li && li.dataset.id;
  switch (el.dataset.act){
    case 'crumb': ui.projectId = null; ui.linkFormFor = null; render(); break;
    case 'add-task': addTask(); break;
    case 'add-project': addProjectFromInput(); break;
    case 'toggle': {
      const m = el.closest('.mtask');
      if (m) toggleTask(m.dataset.pid, m.dataset.tid);
      else toggleTask(ui.projectId, id);
      break;
    }
    case 'urgent': toggleUrgent(id); break;
    case 'client-up': if (c){ moveClient(c.id, -1); focusSel('[data-act="client-up"]:not(:disabled)') || focusSel('[data-act="client-down"]'); } break;
    case 'client-down': if (c){ moveClient(c.id, 1); focusSel('[data-act="client-down"]:not(:disabled)') || focusSel('[data-act="client-up"]'); } break;
    case 'gh-open': openConnect(); break;
    case 'gh-cancel': closeConnect(); break;
    case 'gh-connect': connectGitHub(); break;
    case 'gh-retry': startGitHub(); break;
    case 'link-open': openLinkForm(); break;
    case 'link-cancel': closeLinkForm(); break;
    case 'link-add': addLink(); break;
    case 'del-link': deleteLink(el.dataset.link); break;
    case 'up': moveTask(id, -1); break;
    case 'down': moveTask(id, 1); break;
    case 'del-task': deleteTask(id); break;
    case 'del-project': deleteProject(); break;
    case 'del-client': deleteClient(); break;
    case 'client-emoji':
      if (c) openEmoji(el, c.emoji, em => { c.emoji = em; changed(); focusSel('#clientEmoji'); });
      break;
    case 'open-file': openFile(); break;
    case 'new-file': startNew(); break;
  }
});

center.addEventListener('keydown', e => {
  const t = e.target;
  if (t.id === 'drop' && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); openFile(); return; }
  if (e.key === 'Enter'){
    if (t.id === 'newTask'){ e.preventDefault(); addTask(); }
    else if (t.id === 'newProject'){ e.preventDefault(); addProjectFromInput(); }
    else if (t.id === 'linkUrl' || t.id === 'linkName'){ e.preventDefault(); addLink(); }
    else if (t.id === 'ghOwner' || t.id === 'ghRepo' || t.id === 'ghToken'){ e.preventDefault(); connectGitHub(); }
    else if (t.id === 'title' || t.classList.contains('task-text')){ e.preventDefault(); t.blur(); }
  } else if (e.key === 'Escape'){
    if (t.id === 'linkUrl' || t.id === 'linkName'){ closeLinkForm(); return; }
    if (t.classList.contains('task-text') || t.id === 'title'){
      if (t.dataset.orig !== undefined && t.value !== t.dataset.orig){ t.value = t.dataset.orig; t.dispatchEvent(new Event('input', {bubbles:true})); }
      t.blur();
    }
  }
});
center.addEventListener('focusin', e => {
  const t = e.target;
  if (t.id === 'title' || t.classList.contains('task-text')) t.dataset.orig = t.value;
});
center.addEventListener('input', e => {
  const t = e.target;
  const {c, p} = current();
  if (t.id === 'newTask'){ const b = $('#addTaskBtn'); if (b) b.hidden = !t.value.trim(); return; }
  if (t.id === 'title'){
    if (t.dataset.kind === 'project' && p) p.name = t.value;
    else if (c){
      c.name = t.value;
      const eb = $('#clientEmoji');
      if (eb && !c.emoji) eb.textContent = initialOf(c.name);
    }
    changed({center:false});
  } else if (t.classList.contains('task-text') && p){
    if (/\n/.test(t.value)) t.value = t.value.replace(/\s*\n\s*/g, ' ');
    fitText(t);
    const task = p.tasks.find(x => x.id === t.closest('.task').dataset.id);
    if (task){ task.text = t.value; changed({center:false}); }
  }
});
center.addEventListener('focusout', e => {
  const t = e.target;
  if ((t.id === 'title' || t.classList.contains('task-text')) && !t.value.trim()){
    t.value = t.dataset.orig && t.dataset.orig.trim() ? t.dataset.orig : (t.id === 'title' ? 'Sin nombre' : 'Tarea sin texto');
    t.dispatchEvent(new Event('input', {bubbles:true}));
  }
});

/* Reordenar arrastrando, con alternativa por ↑ ↓ */
let drag = null;
center.addEventListener('pointerdown', e => {
  const h = e.target.closest('.handle');
  if (!h || e.button !== 0) return;
  const li = h.closest('.task');
  e.preventDefault();
  h.setPointerCapture(e.pointerId);
  drag = {id: li.dataset.id, li, list: li.parentElement, wrap: li.closest('.tasks-wrap'), beforeId: undefined};
  drag.line = drag.wrap.querySelector('.insert-line');
  li.classList.add('dragging');
});
center.addEventListener('pointermove', e => {
  if (!drag) return;
  const rows = [...drag.list.querySelectorAll('.task')];
  const top = drag.wrap.getBoundingClientRect().top;
  let beforeId = null, y = null;
  for (const r of rows){
    const b = r.getBoundingClientRect();
    if (e.clientY < b.top + b.height / 2){ beforeId = r.dataset.id; y = b.top - top; break; }
  }
  if (beforeId === null) y = rows[rows.length - 1].getBoundingClientRect().bottom - top;
  drag.beforeId = beforeId;
  drag.line.style.top = y + 'px';
  drag.line.style.display = 'block';
});
function endDrag(commit){
  if (!drag) return;
  const d = drag; drag = null;
  d.li.classList.remove('dragging');
  d.line.style.display = 'none';
  if (!commit || d.beforeId === undefined || d.beforeId === d.id) return;
  const {p} = current();
  if (!p) return;
  const before = p.tasks.map(t => t.id).join();
  const visIds = [...d.list.querySelectorAll('.task')].map(r => r.dataset.id).filter(id => id !== d.id);
  const from = p.tasks.findIndex(t => t.id === d.id);
  const [task] = p.tasks.splice(from, 1);
  let to;
  if (d.beforeId === null){
    const last = visIds[visIds.length - 1];
    to = last ? p.tasks.findIndex(t => t.id === last) + 1 : from;
  } else {
    to = p.tasks.findIndex(t => t.id === d.beforeId);
  }
  p.tasks.splice(to, 0, task);
  if (p.tasks.map(t => t.id).join() !== before) changed();
}
center.addEventListener('pointerup', () => endDrag(true));
center.addEventListener('pointercancel', () => endDrag(false));

/* ---------- Eventos: archivo ---------- */
$('#saveBtn').addEventListener('click', saveNow);
$('#openBtn').addEventListener('click', openFile);
$('#newBtn').addEventListener('click', startNew);
$('#ghBtn').addEventListener('click', openConnect);
$('#disconnectBtn').addEventListener('click', disconnectGitHub);
$('#copyBtn').addEventListener('click', () => {
  // Copia de respaldo: no cambia el estado de guardado en GitHub.
  const blob = new Blob([serialize()], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'seguimiento-koru-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
});
$('#fileInput').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if (f) await loadFile(f, null);
});
let dragDepth = 0;
const hasFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
window.addEventListener('dragenter', e => { if (!hasFiles(e)) return; dragDepth++; const z = $('#drop'); if (z) z.classList.add('over'); });
window.addEventListener('dragleave', e => { if (!hasFiles(e)) return; if (--dragDepth <= 0){ dragDepth = 0; const z = $('#drop'); if (z) z.classList.remove('over'); } });
window.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
window.addEventListener('drop', async e => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  dragDepth = 0;
  const z = $('#drop'); if (z) z.classList.remove('over');
  const dt = e.dataTransfer;
  const item = dt.items && dt.items[0];
  const handlePromise = item && item.kind === 'file' && typeof item.getAsFileSystemHandle === 'function'
    ? item.getAsFileSystemHandle().catch(() => null) : Promise.resolve(null);
  const file = dt.files && dt.files[0];
  if (!file) return;
  if (gh.cfg){ toast('Tus datos se guardan en GitHub. Para abrir un archivo, primero pulsa «Desconectar GitHub» en el panel derecho.'); return; }
  if (!await confirmDiscard()) return;
  const handle = await handlePromise;
  await loadFile(file, handle && handle.kind === 'file' ? handle : null);
});
window.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's'){ e.preventDefault(); saveNow(); }
  if (e.key === 'Escape' && !pop.hidden) closeEmoji(true);
});
window.addEventListener('beforeunload', e => {
  if (isDirty()){ e.preventDefault(); e.returnValue = ''; }
});

const today = new Date().toLocaleDateString('es', {weekday:'long', day:'numeric', month:'long'});
$('#today').textContent = today.charAt(0).toLocaleUpperCase('es') + today.slice(1);
let fitTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(fitTimer);
  fitTimer = setTimeout(() => document.querySelectorAll('textarea.task-text').forEach(fitText), 100);
});

// Al volver a la pestaña, trae lo que se haya guardado desde otro lugar.
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refreshFromGitHub(); });
window.addEventListener('online', () => { if (gh.cfg && gh.offline) ghSave(); });
// Último intento al cerrar la página, si quedó algo sin subir.
window.addEventListener('pagehide', () => {
  if (!gh.cfg || !isDirty() || gh.saving) return;
  ghFetch(gh.cfg, ghContentsPath(gh.cfg), {method:'PUT', keepalive:true, body: ghPutBody(serialize(), gh.sha)})
    .catch(() => { /* La página se está cerrando: no queda dónde avisar. */ });
});

gh.cfg = loadCfg();
if (gh.cfg) startGitHub(); else render();
})();
</script>
</body>
