/* ===== KSVT 1.1 — primitivas ===== */
:root{
  --gray-900:#1d1d1d;--gray-850:#232323;--gray-800:#2e2e2e;--gray-750:#383838;--gray-700:#404040;
  --gray-600:#4c4c4c;--gray-500:#818181;--gray-400:#a1a1a1;--gray-300:#b4b4b4;--gray-100:#d6d6d6;--white:#ffffff;
  --orange-300:#ff8f78;--orange-400:#f56b50;--orange-500:#e8543a;--orange-600:#c94328;--orange-700:#b83f2a;--orange-950:#2a0d07;
  --green-500:#8fb46a;--green-950:#16210c;
  --red-surface:#3a2323;--red-on-surface:#f0c0b6;
}
/* ===== KSVT 1.1 — semánticas ===== */
:root{
  --border-default:var(--gray-900);
  --border-strong:var(--gray-600);
  --border-accent:var(--orange-700);
  --text-primary:var(--gray-100);
  --text-secondary:var(--gray-300);
  --text-tertiary:var(--gray-400);
  --text-on-accent:var(--white);
  --text-accent:var(--orange-300);
  --accent:var(--orange-500);
  --accent-hover:var(--orange-400);
  --accent-fill:var(--orange-600);
  --accent-wash:rgba(232,84,58,.08);
  --accent-glow:rgba(232,84,58,.35);
  --status-success:var(--green-500);
  --status-danger-surface:var(--red-surface);
  --status-danger-text:var(--red-on-surface);
  --focus-ring:0 0 0 2px var(--accent);
  --focus-offset:1px;
  --space-1:4px;--space-2:6px;--space-3:10px;--space-4:14px;--space-5:20px;--space-6:28px;
  --radius-pill:999px;
  --font-weight-regular:400;--font-weight-strong:600;
  --duration-fast:120ms;--duration-move:140ms;--duration-fade:180ms;
  --ease-move:cubic-bezier(.2,.8,.3,1);
  --lift-hover:2px;--press-scale:.97;
  --shadow-hover:0 2px 8px var(--accent-glow);
  --shadow-float:0 10px 28px rgba(0,0,0,.45);
}
/* ===== Variante Refugio (heredada de koru-project-tracker) =====
   Cambian forma, aire, tipografía y profundidad. Paleta y estados intactos. */
:root{
  --surface-canvas:var(--gray-850);
  --surface-panel:var(--gray-800);
  --surface-card:var(--gray-800);
  --surface-raised:var(--gray-750);
  --surface-sunken:var(--gray-900);
  --surface-soft:rgba(255,255,255,.06);
  --surface-soft-hover:rgba(255,255,255,.1);
  --surface-selected:rgba(232,84,58,.15);
  --surface-overlay:rgba(12,12,12,.6);
  --border-soft:rgba(255,255,255,.07);

  --font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,"Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-size-support:12px;
  --font-size-label:13px;
  --font-size-action:14px;
  --font-size-body:15px;
  --font-size-card-title:16px;
  --font-size-title:30px;
  --line-height:1.5;

  --space-7:40px;--space-8:56px;
  --radius:8px;--radius-md:10px;--radius-lg:14px;--radius-xl:18px;

  --control-height:36px;
  --control-height-compact:28px;
  --control-padding:8px 14px;
  --panel-width-left:340px;
  --panel-width-right:288px;
  --content-max-width:830px;

  --shadow-card:0 1px 2px rgba(0,0,0,.28);
  --shadow-active:0 1px 3px rgba(0,0,0,.4);

  /* Extensión propuesta para Guiones */
  --kind-column:156px;     /* ancho de la etiqueta de tipo de línea */
  --day-min-height:112px;  /* alto mínimo de un día en el calendario */
  --status-dot:8px;
}

/* ===== Base ===== */
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  background:var(--surface-canvas);color:var(--text-primary);
  font:var(--font-weight-regular) var(--font-size-body)/var(--line-height) var(--font-family);
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
button,input,select,textarea{font:inherit;color:inherit;}
:focus-visible{outline:none;box-shadow:var(--focus-ring);outline-offset:var(--focus-offset);}
[hidden]{display:none !important;}
/* Barras de desplazamiento: invisibles en reposo, finas al pasar el cursor (igual que Tareas) */
*{scrollbar-width:thin;scrollbar-color:transparent transparent;}
*:hover{scrollbar-color:rgba(255,255,255,.16) transparent;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent;}
::-webkit-scrollbar-thumb{background:transparent;border:3px solid transparent;border-radius:999px;background-clip:content-box;}
:hover::-webkit-scrollbar-thumb{background-color:rgba(255,255,255,.16);}
::-webkit-scrollbar-thumb:hover{background-color:rgba(255,255,255,.3);}

.shell{display:grid;grid-template-columns:var(--panel-width-left) minmax(0,1fr) var(--panel-width-right);height:100%;}
.col{display:flex;flex-direction:column;overflow:hidden;background:var(--surface-panel);}
.col-left{border-right:1px solid var(--border-soft);}
.col-right{border-left:1px solid var(--border-soft);overflow-y:auto;}
.center{display:flex;flex-direction:column;min-width:0;background:var(--surface-canvas);overflow:hidden;}

/* ===== Botones ===== */
.b{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);
  height:var(--control-height);padding:var(--control-padding);
  background:var(--surface-soft);color:var(--text-primary);
  border:none;border-radius:var(--radius-md);
  font-size:var(--font-size-label);font-weight:var(--font-weight-strong);
  cursor:pointer;user-select:none;white-space:nowrap;
  transition:background var(--duration-fast),box-shadow var(--duration-fast),transform var(--duration-fast);
}
.b:hover{background:var(--surface-soft-hover);color:var(--text-primary);}
.b:active{transform:scale(var(--press-scale));}
.b.go{background:var(--accent-fill);color:var(--text-on-accent);font-size:var(--font-size-action);}
.b.go:hover{background:var(--accent-hover);box-shadow:0 4px 14px var(--accent-glow);}
.b.tall{height:calc(var(--control-height) + var(--space-1));}
.b.deliver{border-radius:var(--radius-pill);}
.b.wide{width:100%;}
.b.sm{height:var(--control-height-compact);padding:4px 10px;font-size:var(--font-size-support);}
.b:disabled{opacity:.45;cursor:not-allowed;pointer-events:none;}
.plus{font-size:18px;line-height:1;font-weight:var(--font-weight-regular);margin-top:-2px;}

.ib{
  display:inline-flex;align-items:center;justify-content:center;flex:none;
  width:var(--control-height-compact);height:var(--control-height-compact);padding:0;
  background:transparent;border:1px solid transparent;border-radius:var(--radius);
  color:var(--text-tertiary);cursor:pointer;font-size:14px;line-height:1;
  transition:background var(--duration-fast),color var(--duration-fast),border-color var(--duration-fast);
}
.ib:hover{background:var(--accent-wash);border-color:var(--border-accent);color:var(--text-accent);}
.ib.danger:hover{background:var(--status-danger-surface);border-color:var(--border-accent);color:var(--status-danger-text);}
.ib:disabled{opacity:.25;pointer-events:none;}

.link-btn{
  background:none;border:none;padding:var(--space-1) 0;cursor:pointer;
  color:var(--text-secondary);font-size:var(--font-size-label);text-decoration:underline;text-underline-offset:3px;
}
.link-btn:hover{color:var(--text-primary);}
.link-btn.danger{color:var(--status-danger-text);}

/* ===== Chips ===== */
.chips{display:flex;flex-wrap:wrap;gap:var(--space-2);}
.chip{
  display:inline-flex;align-items:center;gap:var(--space-2);
  height:30px;padding:0 12px;
  background:var(--surface-soft);border:1px solid var(--border-soft);border-radius:var(--radius-md);
  font-size:var(--font-size-label);color:var(--text-secondary);cursor:pointer;user-select:none;
  transition:background var(--duration-fast),color var(--duration-fast),border-color var(--duration-fast);
}
.chip:hover{background:var(--surface-soft-hover);color:var(--text-primary);}
.chip.active{background:var(--surface-selected);border-color:var(--border-accent);color:var(--text-accent);}
.chip.active:hover{background:rgba(232,84,58,.2);}

/* ===== Campos ===== */
.field{
  width:100%;height:var(--control-height);padding:0 12px;
  background:var(--surface-sunken);border:1px solid var(--border-soft);border-radius:var(--radius-md);
  color:var(--text-primary);font-size:var(--font-size-label);
}
.field.sm{height:30px;font-size:var(--font-size-support);}
.field:focus{outline:none;border-color:var(--border-strong);box-shadow:var(--focus-ring);}
.field::placeholder,textarea::placeholder,input::placeholder{color:var(--text-tertiary);opacity:1;}
input[type=date].field{color-scheme:dark;font-variant-numeric:tabular-nums;}
select.field{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text-tertiary) 50%),linear-gradient(135deg,var(--text-tertiary) 50%,transparent 50%);background-position:calc(100% - 17px) 15px,calc(100% - 12px) 15px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px;cursor:pointer;}
.flabel{display:flex;flex-direction:column;gap:var(--space-1);font-size:var(--font-size-support);color:var(--text-secondary);}
.help{margin:var(--space-2) 0 0;font-size:var(--font-size-support);color:var(--text-tertiary);line-height:1.45;}

/* ===== Estados de una pieza ===== */
.sdot{width:var(--status-dot);height:var(--status-dot);border-radius:50%;flex:none;display:inline-block;}
.s-idea{box-shadow:inset 0 0 0 1.5px var(--gray-500);}
.s-guion{background:var(--gray-300);}
.s-produccion{background:var(--accent);}
.s-programada{box-shadow:inset 0 0 0 1.5px var(--accent);}
.s-publicada{background:var(--status-success);}
.tglyph{flex:none;width:12px;text-align:center;font-size:10px;color:var(--text-tertiary);}

/* ===== Panel izquierdo ===== */
.left-top{padding:var(--space-4);}
.brand{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-5) var(--space-5) var(--space-2);}
.brand-mark{width:30px;height:30px;border-radius:9px;flex:none;background:var(--accent-fill);color:var(--text-on-accent);display:flex;align-items:center;justify-content:center;font-size:var(--font-size-support);font-weight:700;}
.brand-text{display:flex;flex-direction:column;min-width:0;}
.brand-name{font-size:var(--font-size-action);font-weight:var(--font-weight-strong);line-height:1.3;}
.brand-date{font-size:var(--font-size-support);color:var(--text-tertiary);line-height:1.3;}
.brand-sys{margin-left:auto;align-self:flex-start;font-size:var(--font-size-support);color:var(--text-tertiary);}
.ksvt-spaces{display:flex;margin:var(--space-3) var(--space-4) 0;}
.ksvt-spaces .seg-btn{flex:1;height:28px;padding:0 6px;border-radius:7px;}
.tree{flex:1;overflow-y:auto;padding:var(--space-1) var(--space-3) var(--space-4);}
.tree-row{display:flex;align-items:center;gap:2px;min-height:36px;padding:0 var(--space-1);border-radius:var(--radius);transition:background var(--duration-fast);}
.tree-row:hover{background:var(--surface-soft);}
.tree-row.active{background:var(--surface-selected);}
.tree-row.active .count{color:var(--text-accent);}
.caret,.caret-space{flex:none;width:22px;height:22px;}
.caret{display:grid;place-items:center;padding:0;background:none;border:none;border-radius:6px;color:var(--text-tertiary);font-size:10px;cursor:pointer;transition:transform var(--duration-move) var(--ease-move),color var(--duration-fast);}
.caret:hover{color:var(--text-primary);}
.caret.open{transform:rotate(90deg);}
.tree-main{flex:1;min-width:0;display:flex;align-items:center;gap:var(--space-3);height:36px;padding:0 var(--space-1);background:transparent;border:none;border-radius:var(--radius);text-align:left;cursor:pointer;}
.tree-main .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--font-size-action);font-weight:var(--font-weight-strong);}
.count{font-size:var(--font-size-support);font-variant-numeric:tabular-nums;color:var(--text-tertiary);}
.avatar{display:inline-grid;place-items:center;flex:none;width:24px;height:24px;border-radius:7px;background:var(--surface-soft);font-size:13px;font-weight:var(--font-weight-strong);color:var(--text-secondary);}
.avatar.all{font-size:12px;color:var(--text-tertiary);}
.tree-pieces{display:flex;flex-direction:column;gap:1px;margin:2px 0 var(--space-2) 28px;padding-left:var(--space-2);border-left:1px solid var(--border-soft);}
.tree-piece{display:flex;align-items:center;gap:var(--space-2);height:32px;padding:0 var(--space-2);background:none;border:none;border-radius:var(--radius);text-align:left;cursor:pointer;color:var(--text-secondary);font-size:var(--font-size-label);transition:background var(--duration-fast),color var(--duration-fast);}
.tree-piece:hover{background:var(--surface-soft);color:var(--text-primary);}
.tree-piece.sel{background:var(--surface-selected);color:var(--text-accent);}
.tree-piece .pname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pdate{font-size:var(--font-size-support);color:var(--text-tertiary);font-variant-numeric:tabular-nums;white-space:nowrap;}
.tree-empty{margin:var(--space-1) var(--space-2) var(--space-2);font-size:var(--font-size-support);color:var(--text-tertiary);}
.new-brand{margin:var(--space-2) var(--space-2) 0;}

.left-bottom{padding:var(--space-3);border-top:1px solid var(--border-soft);}
.store-card{padding:var(--space-3) var(--space-4) var(--space-4);background:var(--surface-canvas);border:1px solid var(--border-soft);border-radius:var(--radius-lg);}
.store-head{display:flex;align-items:center;gap:var(--space-2);font-size:var(--font-size-label);font-weight:var(--font-weight-strong);}
.store-dot{width:var(--status-dot);height:var(--status-dot);border-radius:50%;background:var(--gray-500);flex:none;}
.store-dot.ok{background:var(--status-success);}
.store-dot.warn{background:var(--accent);}
.store-dot.bad{background:var(--status-danger-text);}
.store-repo{margin:2px 0 0 14px;font-size:var(--font-size-support);color:var(--text-tertiary);}
.store-status{margin:var(--space-2) 0 var(--space-3);font-size:var(--font-size-support);color:var(--text-secondary);line-height:1.45;}
.store-status.bad{color:var(--status-danger-text);}
.store-btns{display:flex;gap:var(--space-2);flex-wrap:wrap;}
.connect-form{display:flex;flex-direction:column;gap:var(--space-3);margin-top:var(--space-3);padding-top:var(--space-3);border-top:1px solid var(--border-soft);}

/* ===== Centro ===== */
.center-head{display:flex;align-items:center;gap:var(--space-4);padding:var(--space-5) var(--space-6) var(--space-4);flex:none;min-height:80px;}
.month{flex:1;margin:0;font-size:26px;font-weight:700;letter-spacing:-.01em;}
.crumb{flex:1;display:flex;align-items:center;gap:var(--space-3);font-size:var(--font-size-action);color:var(--text-secondary);font-weight:var(--font-weight-strong);}
.head-nav{display:flex;align-items:center;gap:var(--space-1);}
.seg{display:inline-flex;gap:2px;padding:3px;background:var(--surface-sunken);border-radius:var(--radius-md);}
.seg-btn{height:30px;padding:0 14px;background:transparent;border:none;border-radius:var(--radius);color:var(--text-secondary);font-size:var(--font-size-label);font-weight:var(--font-weight-strong);cursor:pointer;transition:background var(--duration-fast),color var(--duration-fast);}
.seg-btn:hover{color:var(--text-primary);}
.seg-btn.active{background:var(--surface-raised);color:var(--text-primary);box-shadow:var(--shadow-active);}
.seg-btn:disabled{opacity:.45;cursor:not-allowed;}
.center-body{flex:1;overflow:auto;}

/* ===== Espacios, Prompts y Banco ===== */
.tree-label{margin:var(--space-4) var(--space-2) var(--space-1);font-size:var(--font-size-support);font-weight:var(--font-weight-strong);color:var(--text-tertiary);}
.tree-label:first-child{margin-top:var(--space-1);}
.part-text,.note-text{
  display:block;width:100%;min-height:72px;padding:var(--space-3) var(--space-4);resize:none;overflow:hidden;
  background:var(--surface-sunken);border:1px solid var(--border-soft);border-radius:var(--radius-md);
  font-size:16px;line-height:1.65;color:var(--text-primary);
}
.part-text.main{min-height:150px;}
.note-text{min-height:300px;}
.part-text:focus,.note-text:focus{outline:none;border-color:var(--border-strong);box-shadow:var(--focus-ring);}
.add-row.prompt-add{padding-left:0;margin:0 0 var(--space-4);}
.tree > .tree-piece{width:100%;}
.reading{max-width:720px;margin:0 auto;padding:0 var(--space-6) var(--space-8);}
.reading-hint{margin:0 0 var(--space-4);font-size:var(--font-size-label);color:var(--text-tertiary);}
.reading-text{padding:var(--space-6);background:var(--surface-panel);border:1px solid var(--border-soft);border-radius:var(--radius-xl);box-shadow:var(--shadow-card);font-size:17px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere;}
.reading-empty{color:var(--text-tertiary);}
.checks{display:flex;flex-direction:column;gap:var(--space-2);}
.check{display:flex;align-items:flex-start;gap:var(--space-3);font-size:var(--font-size-label);line-height:1.45;}
.check .sdot{margin-top:6px;}
.capture-card textarea{
  display:block;width:100%;min-height:96px;margin-bottom:var(--space-2);padding:var(--space-3);resize:none;overflow:hidden;
  background:var(--surface-sunken);border:1px solid var(--border-soft);border-radius:var(--radius-md);font-size:var(--font-size-body);line-height:1.5;
}
.capture-card textarea:focus{outline:none;border-color:var(--border-strong);box-shadow:var(--focus-ring);}
.capture-row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-2);}
.capture-row .chips{flex:1;}
.cap-topic{width:170px;height:var(--control-height);}
.ncards{display:flex;flex-direction:column;gap:var(--space-2);}
.ncard{
  display:flex;flex-direction:column;gap:var(--space-2);width:100%;padding:var(--space-4);
  background:var(--surface-panel);border:1px solid var(--border-soft);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);
  text-align:left;cursor:pointer;transition:background var(--duration-fast),border-color var(--duration-fast);
}
.ncard:hover{background:var(--surface-raised);border-color:var(--border-strong);}
.ncard-meta{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-2);}
.ncard-meta .ledited{margin-left:auto;}
.ncard-title{font-size:var(--font-size-card-title);font-weight:var(--font-weight-strong);line-height:1.35;}
.ncard.k-frase .ncard-title{font-size:18px;font-style:italic;font-weight:500;}
.ncard-text{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line;font-size:14px;line-height:1.5;color:var(--text-secondary);}
.hint-empty{margin:var(--space-5) 0;text-align:center;font-size:var(--font-size-label);color:var(--text-tertiary);}
.head-search{flex:none;width:260px;}
.frases{display:flex;flex-direction:column;gap:var(--space-2);}
.frase{display:flex;align-items:flex-start;gap:var(--space-2);padding:var(--space-2) var(--space-3);background:var(--surface-soft);border-radius:var(--radius-md);}
.frase-text{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line;font-size:var(--font-size-label);font-style:italic;line-height:1.45;}
.src-link{display:inline-block;margin-top:var(--space-2);font-size:var(--font-size-label);color:var(--text-accent);}

/* ===== Puente con Tareas ===== */
.tbar{display:block;height:6px;margin-top:var(--space-3);background:rgba(255,255,255,.1);border-radius:var(--radius-pill);overflow:hidden;}
.tbar i{display:block;height:100%;background:var(--accent);border-radius:var(--radius-pill);}
.tbar.done i{background:var(--status-success);}
.tf{display:flex;flex-direction:column;gap:var(--space-3);}
.tf-tasks{height:auto;min-height:110px;padding:var(--space-2) var(--space-3);resize:vertical;line-height:1.5;}
.ltasks{font-size:var(--font-size-support);color:var(--text-secondary);font-variant-numeric:tabular-nums;padding:2px 8px;border-radius:var(--radius-pill);background:var(--surface-soft);}
.ltasks.ok{color:var(--status-success);}

/* ===== Lista de guiones ===== */
.list{display:flex;flex-direction:column;gap:var(--space-4);max-width:var(--content-max-width);margin:0 auto;padding:0 var(--space-6) var(--space-8);}
.lgroup{padding:var(--space-2);background:var(--surface-panel);border:1px solid var(--border-soft);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);}
.lgroup.week{border-color:var(--border-accent);}
.lgroup-head{display:flex;align-items:center;gap:var(--space-2);width:100%;height:38px;padding:0 var(--space-2);background:none;border:none;border-radius:var(--radius);text-align:left;cursor:pointer;transition:background var(--duration-fast);}
.lgroup-head:hover{background:var(--surface-soft);}
.lgroup-head .caret{display:grid;width:18px;height:18px;}
.lgroup-title{flex:1;font-size:var(--font-size-action);font-weight:var(--font-weight-strong);}
.lgroup-help{margin:0 var(--space-2) var(--space-2) 34px;font-size:var(--font-size-support);color:var(--text-tertiary);}
.lrows{display:flex;flex-direction:column;gap:1px;}

const isThisWeek = p => !!p.date && !isDone(p) && daysUntil(p.date) <= 7;
function rel(ts){
  const min = Math.floor((Date.now() - ts) / 60000);
  if (min < 1) return 'ahora';
  if (min < 60) return `hace ${min} min`;
  const h = Math.floor(min / 60);
  if (h < 24) return `hace ${h} h`;
  const d = Math.floor(h / 24);
  if (d === 1) return 'ayer';
  if (d < 7) return `hace ${d} días`;
  const t = new Date(ts); return `el ${t.getDate()} ${MONTHS_SHORT[t.getMonth()]}`;
}
const ago = ts => `Editado ${rel(ts)}`;
function agoShort(ts){
  const min = Math.floor((Date.now() - ts) / 60000);
  if (min < 1) return 'ahora';
  if (min < 60) return `${min} min`;
  const h = Math.floor(min / 60);
  if (h < 24) return `${h} h`;
  const d = Math.floor(h / 24);
  if (d === 1) return 'ayer';
  if (d < 7) return `${d} d`;
  const t = new Date(ts); return `${t.getDate()} ${MONTHS_SHORT[t.getMonth()]}`;
}
function dueText(p){
  if (!p.date) return 'Sin fecha';
  if (isDone(p)) return shortDate(p.date);
  const d = daysUntil(p.date);
  if (d < 0) return `Atrasada ${-d} ${d === -1 ? 'día' : 'días'}`;
  if (d === 0) return 'Hoy';
  if (d === 1) return 'Mañana';
  if (d <= 7) return `Faltan ${d} días`;
  return shortDate(p.date);
}
const dueClass = p => !p.date ? 'none' : (!isDone(p) && daysUntil(p.date) <= 1 ? 'urgent' : '');

function toB64(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function fromB64(b64){
  const bin = atob(b64.replace(/\s/g, ''));
  return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
}
function blobToDataURL(blob){
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error || new Error('no se pudo leer el archivo')); r.readAsDataURL(blob); });
}
async function toDataURL(src){
  if (src.startsWith('data:')) return src;
  return blobToDataURL(await (await fetch(src)).blob());
}
function download(name, text, mime){
  const url = URL.createObjectURL(new Blob([text], {type: mime + ';charset=utf-8'}));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function normalize(d){
  if (!d || typeof d !== 'object' || !Array.isArray(d.pieces)) throw new Error('el archivo no tiene el formato de guiones');
  const brands = Array.isArray(d.brands) && d.brands.length
    ? d.brands.map(b => ({id:String(b.id || uid()), name:String(b.name || 'Sin nombre'), emoji:String(b.emoji || '')}))
    : [{id:uid(), name:'Koru Studio', emoji:''}];
  const ids = new Set(brands.map(b => b.id));
  const pieces = d.pieces.map(p => {
    const type = TYPES.some(t => t[0] === p.type) ? p.type : 'video';
    const kinds = kindsFor(type).map(k => k[0]);
    return {
      id:String(p.id || uid()),
      brandId:ids.has(p.brandId) ? p.brandId : brands[0].id,
      title:String(p.title || ''),
      type,
      status:STATES.some(s => s[0] === p.status) ? p.status : 'idea',
      date:/^\d{4}-\d{2}-\d{2}$/.test(p.date || '') ? p.date : null,
      sections:(Array.isArray(p.sections) ? p.sections : []).map(s => ({
        id:String(s.id || uid()), title:String(s.title || ''),
        blocks:(Array.isArray(s.blocks) ? s.blocks : []).map(b => ({id:String(b.id || uid()), kind:kinds.includes(b.kind) ? b.kind : 'nota', text:String(b.text || '')}))
      })),
      caption:String(p.caption || ''),
      hashtags:String(p.hashtags || ''),
      links:(Array.isArray(p.links) ? p.links : []).filter(l => l && l.url).map(l => ({id:String(l.id || uid()), url:String(l.url), note:String(l.note || '')})),
      images:(Array.isArray(p.images) ? p.images : []).filter(i => i && (i.path || i.data)).map(i => {
        const im = {id:String(i.id || uid()), name:String(i.name || 'imagen.jpg'), w:i.w | 0, h:i.h | 0};
        if (i.path) im.path = String(i.path); else im.data = String(i.data);
        return im;
      }),
      updated:p.updated || Date.now()
    };
  });
  const prompts = (Array.isArray(d.prompts) ? d.prompts : []).map(x => {
    const parts = {}, on = {};
    for (const [k] of PROMPT_PARTS){
      parts[k] = String(x.parts?.[k] || '');
      on[k] = x.on && k in x.on ? !!x.on[k] : (k === 'contexto' || k === 'pedido');
    }
    on.pedido = true;
    return {id:String(x.id || uid()), title:String(x.title || ''), isTemplate:!!x.isTemplate, parts, on, updated:x.updated || Date.now(), lastCopied:x.lastCopied || null};
  });
  const notes = (Array.isArray(d.notes) ? d.notes : []).map(n => ({
    id:String(n.id || uid()), title:String(n.title || ''), text:String(n.text || ''),
    kind:NOTE_KINDS.some(k => k[0] === n.kind) ? n.kind : 'idea',
    topic:String(n.topic || '').trim(), brandId:n.brandId && ids.has(n.brandId) ? n.brandId : null,
    source:String(n.source || ''), archived:!!n.archived, created:n.created || Date.now(), updated:n.updated || Date.now()
  })).filter(n => n.title || n.text);
  return {version:1, brands, pieces, prompts, notes};
}

function applyData(d){
  data = normalize(d);
  for (const v of imgCache.values()) if (v.startsWith('blob:')) URL.revokeObjectURL(v);
  imgCache.clear();
  ui.brand = 'all'; ui.back = 'list'; ui.focus = false;
  ui.piece = null; ui.view = 'list'; ui.prompt = null; ui.promptView = 'edit'; ui.note = null; ui.bankFilter = {type:'all', value:null};
  const cands = [...data.pieces.map(x => ['planner', x, 'piece']), ...data.prompts.map(x => ['textos', x, 'prompt']), ...data.notes.map(x => ['textos', x, 'note'])];
  const last = cands.reduce((a, c) => (!a || c[1].updated > a[1].updated) ? c : a, null);
  if (!koruHub()) ui.space = last ? last[0] : 'planner';
  if (last && last[2] === 'piece'){ ui.piece = last[1].id; ui.view = 'script'; }
  if (last && last[2] === 'prompt') ui.prompt = last[1].id;
}

function defaultSections(type){
  const blk = kind => ({id:uid(), kind, text:''});
  if (type === 'carrusel') return ['Portada','Diapositiva 2','Cierre'].map(t => ({id:uid(), title:t, blocks:[blk('texto'), blk('visual')]}));
  if (type === 'post') return [{id:uid(), title:'Imagen', blocks:[blk('texto'), blk('visual')]}];
  return ['Gancho','Desarrollo','Cierre'].map(t => ({id:uid(), title:t, blocks:[blk('voz')]}));
}

  const rest = vis.filter(p => !isThisWeek(p));
  const order = [['produccion','Producción'],['guion','Guion'],['idea','Ideas'],['programada','Programada'],['publicada','Publicada']];
  let h = `<div class="list">`;
  if (week.length) h += groupHTML('week', 'Para esta semana', week, 'Se publican en los próximos siete días y todavía no están programadas.');
  for (const [st, label] of order){
    const ps = sortList(rest.filter(p => p.status === st));
    if (!ps.length && st !== 'idea') continue;
    h += groupHTML(st, label, ps, st === 'idea' && !vis.length ? 'Todavía no hay guiones. Escribe tu primera idea aquí abajo, o pulsa «Nueva pieza» para empezar un guion completo.' : '');

}

function calendarHTML(){
  const y = ui.month.getFullYear(), m = ui.month.getMonth();

  const rows = Math.ceil((off + dim) / 7);
  const todayKey = dkey(new Date());
  const vis = visiblePieces();
  const byDate = {};
  for (const p of sortPieces(vis)) if (p.date) (byDate[p.date] = byDate[p.date] || []).push(p);

  for (let i = 0; i < rows * 7; i++){
    const d = new Date(y, m, 1 - off + i), k = dkey(d);
    cells += `<div class="day ${d.getMonth() !== m ? 'out' : ''} ${k === todayKey ? 'today' : ''}" data-date="${k}">

      case 'offline': dot = 'warn'; status = 'Sin conexión. Guardo en cuanto vuelva la red.'; break;

function toggleFocus(){
  if (!isEditorView()) return;
  ui.focus = !ui.focus;

  const blk = ae?.closest?.('[data-blk]')?.dataset.blk, aid = ae && body.contains(ae) ? ae.id : '';

function setType(p, type){
  if (p.type === type) return;
  const map = type === 'video' ? TO_VIDEO : TO_STATIC;
  const kinds = kindsFor(type).map(k => k[0]);
  for (const s of p.sections) for (const b of s.blocks){
    b.kind = map[b.kind] || b.kind;
    if (!kinds.includes(b.kind)) b.kind = 'nota';
  }
  p.type = type;
  touch(p); render();
}

function deletePiece(p){
  if (!confirm(`¿Eliminar «${p.title || 'Sin título'}»? Se borra con su guion y su material, y no se puede deshacer.`)) return;
  for (const im of p.images) if (im.path) store.pendingDeletes.push(im.path);
  data.pieces = data.pieces.filter(x => x.id !== p.id);
  ui.piece = null; ui.view = ui.back || 'list'; ui.focus = false;
  markDirty(); render();
}

function autosize(t){ t.style.height = 'auto'; t.style.height = (t.scrollHeight + 2) + 'px'; }

function focusBlock(id, pos){
  const ta = body.querySelector(`[data-blk="${id}"] textarea`);
  if (!ta) return;
  ta.focus();
  const n = pos === 'end' ? ta.value.length : (typeof pos === 'number' ? Math.min(pos, ta.value.length) : 0);
  ta.setSelectionRange(n, n);
}

function updateLive(p){
  if (p.type === 'video'){
    body.querySelectorAll('[data-sec]').forEach(el => {
      const s = p.sections.find(x => x.id === el.dataset.sec);
      const d = el.querySelector('.sec-dur'); if (s && d) d.textContent = durOf(voiceWords(s));
    });
    const md = $('#metaDur'); if (md) md.textContent = `${durOf(totalVoiceWords(p))} de voz en off`;
  }
  const ps = $('#pieceSummary'); if (ps) ps.innerHTML = summaryText(p);
}

function moveBlock(p, si, bi, dir){
  const s = p.sections[si], b = s.blocks[bi], j = bi + dir;
  if (j >= 0 && j < s.blocks.length){ s.blocks.splice(bi, 1); s.blocks.splice(j, 0, b); }
  else if (dir < 0 && si > 0){ s.blocks.splice(bi, 1); p.sections[si - 1].blocks.push(b); }
  else if (dir > 0 && si < p.sections.length - 1){ s.blocks.splice(bi, 1); p.sections[si + 1].blocks.unshift(b); }
  else return null;
  touch(p);
  return b.id;
}

function locate(p, el){
  const secEl = el.closest('[data-sec]'); if (!secEl) return null;
  const si = p.sections.findIndex(s => s.id === secEl.dataset.sec); if (si < 0) return null;
  const row = el.closest('[data-blk]');
  const bi = row ? p.sections[si].blocks.findIndex(b => b.id === row.dataset.blk) : -1;
  return {si, s:p.sections[si], bi, b:bi >= 0 ? p.sections[si].blocks[bi] : null, row};
}

const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const touchNote = n => { n.updated = Date.now(); markDirty(); };
const touchPrompt = pr => { pr.updated = Date.now(); markDirty(); };

function flash(btn, label, ms = 1500){
  if (btn._flashing) return;
  btn._flashing = true;
  const prev = btn.innerHTML; btn.textContent = label;
  setTimeout(() => { if (btn.isConnected) btn.innerHTML = prev; btn._flashing = false; }, ms);
}

async function copyText(text){
  try {
    if (navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(text); return true; }
  } catch (err){ console.warn('El portapapeles directo no respondió, uso la vía alternativa:', err); }
  const ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (err){ console.error('No se pudo copiar:', err); }
  ta.remove();
  return ok;
}

function topics(){
  const m = new Map();
  for (const n of data.notes) if (!n.archived && n.topic) m.set(n.topic, (m.get(n.topic) || 0) + 1);
  return [...m.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
}
const topicDatalist = () => `<datalist id="topicList">${topics().map(([t]) => `<option value="${esc(t)}">`).join('')}</datalist>`;

function splitCapture(raw){
  const t = raw.replace(/\r/g, '').trim();
  const nl = t.indexOf('\n');
  let title = nl < 0 ? t : t.slice(0, nl).trim(), text = nl < 0 ? '' : t.slice(nl + 1).trim();
  if (title.length > 100){ text = t; title = title.slice(0, 80).replace(/\s+\S*$/, '') + '…'; }
  return {title, text};
}
function makeNote(raw, kind, topic, brandId, source){
  const {title, text} = splitCapture(raw), now = Date.now();
  return {id:uid(), title, text, kind, topic:(topic || '').trim(), brandId:brandId || null, source:source || '', archived:false, created:now, updated:now};
}
const fullNote = n => !n.text ? n.title : (n.title.endsWith('…') && n.text.startsWith(n.title.slice(0, -1).trim()) ? n.text : `${n.title}\n${n.text}`);

/* --- Prompts --- */
function assemble(pr){
  const on = PROMPT_PARTS.filter(([k]) => pr.on[k] && pr.parts[k].trim());
  if (on.length === 1 && on[0][0] === 'pedido') return pr.parts.pedido.trim();
  return on.map(([k, l]) => `## ${l}\n${pr.parts[k].trim()}`).join('\n\n');
}

function newPrompt(tpl){
  const pr = {id:uid(), title:'', isTemplate:false, parts:{}, on:{}, updated:Date.now(), lastCopied:null};
  for (const [k] of PROMPT_PARTS){ pr.parts[k] = tpl ? tpl.parts[k] : ''; pr.on[k] = tpl ? tpl.on[k] : (k === 'contexto' || k === 'pedido'); }
  data.prompts.push(pr);
  ui.space = 'textos'; ui.prompt = pr.id; ui.note = null; ui.promptView = 'edit'; ui.focus = true;
  markDirty(); render();
  const first = PROMPT_PARTS.find(([k]) => pr.on[k] && !pr.parts[k].trim());
  (first ? $('#part-' + first[0]) : $('#promptTitle'))?.focus();
}

}

function promptChecks(pr){
  const out = [];
  if (!pr.parts.pedido.trim()) out.push(['warn', 'Falta decir qué necesitas. Es la única sección obligatoria.']);
  if (!pr.on.contexto || !pr.parts.contexto.trim()) out.push(['tip', 'Sin contexto, la IA adivina quién eres y para qué es. Una o dos frases bastan.']);
  if (!pr.on.formato || !pr.parts.formato.trim()) out.push(['tip', 'No dices cómo quieres la respuesta. Si te importa la forma, añade «Formato de respuesta».']);
  const all = PROMPT_PARTS.filter(([k]) => pr.on[k]).map(([k]) => pr.parts[k]).join('\n\n');
  const longest = Math.max(0, ...all.split(/\n\s*\n/).map(countWords));
  if (longest > 90) out.push(['tip', `Hay un párrafo de ${longest} palabras. Partirlo en dos ayuda a que se entienda.`]);
  return out;
}

function insertFrase(n, btn){
  const text = fullNote(n);
  let ta = null;
  if (ui.view === 'script' && lastFocus && lastFocus.piece === ui.piece){
    ta = lastFocus.blk ? body.querySelector(`[data-blk="${lastFocus.blk}"] textarea`) : $('#' + lastFocus.id);
  }
  if (!ta){ copyText(text).then(ok => flash(btn, ok ? 'Copiada' : 'No se pudo')); return; }
  const s = ta.selectionStart ?? ta.value.length, e = ta.selectionEnd ?? s;
  const before = ta.value.slice(0, s), after = ta.value.slice(e);
  const sep = before && !/\s$/.test(before) ? ' ' : '';
  ta.value = before + sep + text + after;
  const pos = (before + sep + text).length;
  ta.dispatchEvent(new Event('input', {bubbles:true}));
  ta.focus(); ta.setSelectionRange(pos, pos);
}

        <option value="__new" ${f.projectId === '__new' ? 'selected' : ''}>+ Proyecto nuevo</option></select></label>
      ${f.projectId === '__new' ? `<label class="flabel">Nombre del proyecto<input class="field" id="tfProjectName" value="${esc(f.projectName)}" autocomplete="off"></label>` : ''}
      <label class="flabel">Tareas, una por línea<textarea class="field tf-tasks" id="tfTasks" rows="5">${esc(f.text)}</textarea></label>
      <div class="row"><button class="b" id="tfCreate" style="flex:1" ${n ? '' : 'disabled'}>Crear ${n} ${n === 1 ? 'tarea' : 'tareas'}</button><button class="link-btn" id="tfCancel">Cancelar</button></div>
      <p class="help" style="margin:0">Cada tarea queda enlazada a esta pieza. Un proyecto puede reunir varias piezas, como una campaña.</p>
    </div></div>`;
  }
  const pg = t.progress(p.id);
  if (pg.total){
    const pct = pg.done === pg.total ? 100 : Math.floor(pg.done / pg.total * 100);
    return `<div class="group"><h2>Tareas</h2>
      <div class="sunken"><strong>${pg.done} de ${pg.total}</strong> tareas hechas<br>${esc(pg.clientName)} › ${esc(pg.projectName)}</div>
      <div class="tbar ${pct === 100 ? 'done' : ''}" role="img" aria-label="${pct} % hecho"><i style="width:${pct}%"></i></div>
      <button class="b wide" data-open-tasks style="margin-top:var(--space-3)">Ver en Tareas</button>
      <button class="link-btn" data-task-form>Añadir más tareas</button>
      <p class="help">El estado de la pieza lo sigues cambiando tú: las tareas miden el avance, no lo deciden.</p></div>`;
  }
  return `<div class="group"><h2>Tareas</h2>
    <p class="help" style="margin:0 0 var(--space-3)">Convierte esta pieza en tareas de un proyecto, sin salir del planner.</p>
    <button class="b wide" data-task-form>Crear tareas</button></div>`;
}

function taskRightClick(e){
  const p = curPiece(), h = koruHub();
  if (e.target.closest('[data-go-tareas]')){ if (h) h.go('tareas'); return true; }
  if (!p) return false;
  if (e.target.closest('[data-task-form]')){ openTaskForm(p); return true; }
  if (e.target.closest('[data-open-tasks]')){ const t = tracker(); if (t && h){ const pg = t.progress(p.id); h.openTasks(pg.clientId, pg.projectId); } return true; }
  const id = e.target.closest('button')?.id;
  if (id === 'tfCancel'){ ui.taskForm = null; renderRight(); return true; }
  if (id === 'tfCreate'){
    const t = tracker(), f = ui.taskForm; if (!t || !f) return true;
    const tasks = f.text.split('\n').map(x => x.trim()).filter(Boolean);
    if (!tasks.length) return true;
    const b = brandOf(p);
    try {
      t.addTasks({clientId:f.clientId === '__new' ? null : f.clientId, clientName:b.name, clientEmoji:b.emoji,
        projectId:f.projectId === '__new' ? null : f.projectId, projectName:f.projectName.trim() || p.title || 'Contenido',
        tasks, ref:{space:'planner', id:p.id, title:p.title || 'Sin título'}});
    } catch (err){
      console.error('No se pudieron crear las tareas:', err);
      toast(`No pude crear las tareas: ${err.message}. Abre el espacio Tareas y vuelve a intentarlo.`);
      return true;
    }
    ui.taskForm = null; renderRight(); renderCenter();
    return true;
  }
  return false;
}

storageEl.addEventListener('click', async e => {
  const id = e.target.closest('button')?.id;
  if (!id) return;
  if (id === 'saveCopy') downloadCopy();
  else if (id === 'openFile') fileInput.click();
  else if (id === 'toggleConnect'){ ui.connectOpen = !ui.connectOpen; ui.connectError = ''; renderStorage(); if (ui.connectOpen) $('#ghToken')?.focus(); }
  else if (id === 'connectBtn'){
    const owner = $('#ghOwner').value.trim(), repo = $('#ghRepo').value.trim(), token = $('#ghToken').value.trim();
    if (!owner || !repo || !token){ ui.connectError = 'Llena los tres campos para conectar.'; renderStorage(); return; }
    const btn = e.target.closest('button'); btn.disabled = true; btn.textContent = 'Conectando…';
    try { await connect(owner, repo, token); }
    catch (err){
      console.error('No se pudo conectar con GitHub:', err);
      store.mode = 'local'; store.cfg = null; store.sha = null; store.loaded = false;
      ui.connectError = err instanceof TypeError ? `No hay conexión con GitHub (${err.message}). Revisa tu internet y vuelve a intentarlo.` : err.message;
      renderStorage();
      const f = $('#ghOwner'); if (f){ f.value = owner; $('#ghRepo').value = repo; $('#ghToken').value = token; }
    }
  }
  else if (id === 'disconnect'){
    const msg = isDirty() ? 'Hay cambios que todavía no llegan a GitHub. Si desconectas ahora se quedan solo en esta pestaña. ¿Desconectar?' : '¿Desconectar de GitHub? Tus guiones siguen allá; esta pestaña queda con una copia que puedes descargar.';
    if (!confirm(msg)) return;
    try { localStorage.removeItem(CFG_KEY); } catch (err){ console.warn('No se pudo olvidar la conexión guardada:', err); }
    clearTimeout(store.timer); clearTimeout(store.retry);
    store.mode = 'local'; store.cfg = null; store.sha = null; store.loaded = false; store.state = 'idle';
    store.savedRev = store.rev - 1;
    render();
  }
  else if (id === 'pullRemote') pullRemote(true);
  else if (id === 'retry'){ if (store.loaded) { store.state = 'idle'; saveNow(); } else startupLoad(); }
});

async function openFileObj(file){
  if (data.pieces.length && (isDirty() || store.mode === 'github') && !confirm(`Abrir «${file.name}» reemplaza los guiones que tienes en pantalla${store.mode === 'github' ? ' y los de GitHub' : ''}. ¿Continuar?`)) return;
  let d;
  try { d = normalize(JSON.parse(await file.text())); }
  catch (err){ console.error('Archivo no válido:', err); toast(`No pude abrir «${file.name}»: ${err.message}. Elige un archivo descargado desde esta herramienta.`); return; }
  applyData(d);
  if (store.mode === 'github'){ markDirty(); }
  else { store.rev++; store.savedRev = store.rev; store.lastSaved = null; }
  render();
}

body.addEventListener('keydown', e => {
  if (ui.space !== 'planner') return;
  if (e.target.id === 'captureInput'){
    if (e.key === 'Escape'){ e.target.value = ''; return; }
    if (e.key !== 'Enter' || e.isComposing) return;
    e.preventDefault();
    const title = e.target.value.trim(); if (!title) return;
    const brandId = ui.brand !== 'all' ? ui.brand : data.brands[0].id;
    const p = {id:uid(), brandId, title, type:'video', status:'idea', date:null, sections:defaultSections('video'), caption:'', hashtags:'', links:[], images:[], updated:Date.now()};
    data.pieces.push(p); touch(p);
    renderTree(); renderCenter(); renderRight();
    $('#captureInput')?.focus();
    return;
  }
  if (e.target.classList.contains('pchip') && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); if (e.key === 'Enter') openPiece(e.target.dataset.piece); else selectChip(e.target.dataset.piece); return; }
  const t = e.target;
  if (t.tagName !== 'TEXTAREA' || !t.closest('[data-blk]')) return;
  const p = curPiece(); const loc = locate(p, t); if (!loc || !loc.b) return;
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing){
    e.preventDefault();
    const after = t.value.slice(t.selectionEnd);
    loc.b.text = t.value.slice(0, t.selectionStart);
    const nb = {id:uid(), kind:loc.b.kind, text:after};
    loc.s.blocks.splice(loc.bi + 1, 0, nb);
    touch(p); renderCenter(); focusBlock(nb.id, 0); updateLive(p);
    return;
  }
  if (e.key === 'Backspace' && t.value === ''){
    e.preventDefault();
    loc.s.blocks.splice(loc.bi, 1);
    const prev = loc.s.blocks[loc.bi - 1] || loc.s.blocks[loc.bi];
    touch(p); renderCenter(); updateLive(p);
    if (prev) focusBlock(prev.id, 'end');
    return;
  }
  if (e.altKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown')){
    e.preventDefault();
    const pos = t.selectionStart;
    const id = moveBlock(p, loc.si, loc.bi, e.key === 'ArrowUp' ? -1 : 1);
    if (id){ renderCenter(); updateLive(p); focusBlock(id, pos); }
  }
});

/* Arrastrar piezas entre días, con eventos de puntero */
let drag = null;
body.addEventListener('pointerdown', e => {
  const chip = e.target.closest('.pchip');
  if (!chip || e.button !== 0) return;
  drag = {id:chip.dataset.piece, chip, x:e.clientX, y:e.clientY, moved:false, ghost:null, target:null};
});
window.addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.moved){
    if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 5) return;
    drag.moved = true;
    drag.ghost = drag.chip.cloneNode(true);
    drag.ghost.classList.remove('sel'); drag.ghost.classList.add('ghost');
    document.body.appendChild(drag.ghost);
    drag.chip.classList.add('dragging');
    document.body.classList.add('dragging-piece');
  }
  drag.ghost.style.transform = `translate(${e.clientX + 10}px,${e.clientY + 10}px)`;
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const tgt = el ? el.closest('[data-date]') : null;
  if (tgt !== drag.target){ drag.target?.classList.remove('drop'); drag.target = tgt; tgt?.classList.add('drop'); }
});
function endDrag(commit){
  const d = drag; drag = null;
  if (!d) return;
  if (!d.moved){ if (commit) selectChip(d.id); return; }
  d.ghost.remove(); d.chip.classList.remove('dragging');
  document.body.classList.remove('dragging-piece');
  d.target?.classList.remove('drop');
  if (commit && d.target){
    const p = data.pieces.find(x => x.id === d.id);
    const nd = d.target.dataset.date || null;
    if (p && p.date !== nd){ p.date = nd; touch(p); }
  }
  render();
}
window.addEventListener('pointerup', () => endDrag(true));
window.addEventListener('pointercancel', () => endDrag(false));

  const p = curPiece();

  const sb = e.target.closest('[data-set-status]'); if (sb && p){ p.status = sb.dataset.setStatus; touch(p); render(); return; }
  const dl = e.target.closest('[data-del-link]'); if (dl && p){ p.links = p.links.filter(l => l.id !== dl.dataset.delLink); touch(p); renderRight(); return; }
  const di = e.target.closest('[data-del-img]');
  if (di && p){
    const im = p.images.find(i => i.id === di.dataset.delImg);
    if (im){ if (im.path) store.pendingDeletes.push(im.path); const c = imgCache.get(im.id); if (c && c.startsWith('blob:')) URL.revokeObjectURL(c); imgCache.delete(im.id); }
    p.images = p.images.filter(i => i.id !== di.dataset.delImg); touch(p); renderRight(); return;
  }

  if (e.target.closest('#imgDrop')){ imgInput.click(); return; }
  const id = e.target.closest('button')?.id;
  if (!id) return;
  if (id === 'openScript' && p) openPiece(p.id);
  else if (id === 'exportList') download('guiones.md', listMD(), 'text/markdown');
  else if (id === 'clearDate' && p){ p.date = null; touch(p); render(); }
  else if (id === 'exportMd' && p) download(`${slug(p.title)}-guion.md`, guionMD(p), 'text/markdown');
  else if (id === 'exportTxt' && p) download(`${slug(p.title)}-voz-en-off.txt`, voiceTXT(p), 'text/plain');
  else if (id === 'deletePiece' && p) deletePiece(p);
  else if (id === 'exportPlan') download(`plan-${ui.month.getFullYear()}-${pad(ui.month.getMonth() + 1)}.md`, planMD(), 'text/markdown');
  else if (id === 'deleteBrand'){
    for (const n of data.notes) if (n.brandId === ui.brand) n.brandId = null;
    data.brands = data.brands.filter(b => b.id !== ui.brand); ui.brand = 'all'; markDirty(); render();
  }
});

right.addEventListener('change', e => {
  if (taskRightChange(e)) return;
  if (ui.space === 'textos'){
    const n = curNote(); if (!n) return;
    if (e.target.id === 'noteBrand'){ n.brandId = e.target.value || null; touchNote(n); }
    if (e.target.id === 'noteSource') renderRight();
    return;
  }
  const p = curPiece();
  if (e.target.id === 'dateInput' && p){
    p.date = e.target.value || null;
    if (p.date){ const d = parseKey(p.date); ui.month = new Date(d.getFullYear(), d.getMonth(), 1); }
    touch(p); render();
  } else if (e.target.id === 'brandSelect' && p){
    p.brandId = e.target.value; if (ui.brand !== 'all') ui.brand = p.brandId; ui.collapsed[p.brandId] = false;
    touch(p); render();
  }
});

right.addEventListener('input', e => {
  if (taskRightInput(e)) return;
  if (ui.space === 'textos'){
    const n = curNote(); if (!n) return;
    if (e.target.id === 'noteTopic'){ n.topic = e.target.value.trim(); touchNote(n); renderTree(); }
    if (e.target.id === 'noteSource'){ n.source = e.target.value.trim(); touchNote(n); }
    return;
  }
  const p = curPiece();
  const ln = e.target.closest('[data-link-note]');
  if (ln && p){ const l = p.links.find(x => x.id === ln.dataset.linkNote); if (l){ l.note = ln.value; touch(p); } return; }
  const b = data.brands.find(x => x.id === ui.brand);
  if (b && e.target.id === 'brandName'){ b.name = e.target.value; markDirty(); renderTree(); }
  if (b && e.target.id === 'brandEmoji'){ b.emoji = e.target.value.trim(); markDirty(); renderTree(); }
});

right.addEventListener('keydown', e => {
  if (e.target.id === 'linkInput' && e.key === 'Enter'){
    e.preventDefault();
    const p = curPiece(); let u = e.target.value.trim(); if (!p || !u) return;
    if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
    try { new URL(u); } catch (err){ toast('Ese enlace no parece válido. Cópialo completo desde la barra del navegador.'); return; }
    p.links.push({id:uid(), url:u, note:''}); touch(p); renderRight(); $('#linkInput')?.focus();
  }
  if (e.target.id === 'imgDrop' && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); imgInput.click(); }
});

imgInput.addEventListener('change', () => { const files = [...imgInput.files]; imgInput.value = ''; if (files.length) addImages(files); });

/* ===== Imágenes ===== */
function compressImage(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => {
      try {
        const max = 1600;
        const k = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
        const w = Math.max(1, Math.round(im.naturalWidth * k)), h = Math.max(1, Math.round(im.naturalHeight * k));
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const ctx = c.getContext('2d'); ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(im, 0, 0, w, h);
        URL.revokeObjectURL(url);
        res({id:uid(), name:file.name.replace(/\.[^.]+$/, '') + '.jpg', w, h, data:c.toDataURL('image/jpeg', .82)});
      } catch (err){ URL.revokeObjectURL(url); rej(err); }
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('el navegador no reconoce el formato')); };
    im.src = url;
  });
}

async function addImages(files){
  const p = curPiece();
  if (!p){ toast('Abre una pieza para añadirle imágenes.'); return; }
  let added = 0;
  for (const f of files){
    if (!f.type.startsWith('image/')) continue;
    try { const im = await compressImage(f); p.images.push(im); imgCache.set(im.id, im.data); added++; }
    catch (err){ console.error(`No se pudo leer ${f.name}:`, err); toast(`No pude leer «${f.name}» (${err.message}). Guárdala como JPG o PNG y vuelve a intentarlo.`); }
  }
  if (added){ touch(p); renderRight(); }
}

async function imgSrc(im){
  if (imgCache.has(im.id)) return imgCache.get(im.id);
  if (im.data){ imgCache.set(im.id, im.data); return im.data; }
  if (im.path && store.mode === 'github' && store.cfg){
    const r = await gh('/contents/' + encodePath(im.path), {accept:'application/vnd.github.raw'});
    if (!r.ok) throw await ghError(r, 'traer una imagen');
    const u = URL.createObjectURL(await r.blob());
    imgCache.set(im.id, u); return u;
  }
  throw new Error('la imagen está guardada en GitHub y esta pestaña no está conectada');
}

function hydrateImages(root){
  root.querySelectorAll('img[data-img-id]').forEach(async el => {
    const id = el.dataset.imgId;
    let im = null;
    for (const p of data.pieces){ im = p.images.find(i => i.id === id); if (im) break; }
    if (!im) return;
    const th = el.closest('.thumb');
    try { const src = await imgSrc(im); if (el.isConnected){ el.src = src; th?.classList.remove('loading'); } }
    catch (err){ console.error(`No se pudo cargar ${im.name}:`, err); if (th){ th.classList.remove('loading'); th.classList.add('failed'); th.title = `No se pudo cargar: ${err.message}`; } }
  });
}

lightbox.addEventListener('click', e => { if (e.target === lightbox || e.target.closest('#lbClose')) lightbox.hidden = true; });

/* ===== Archivos arrastrados y pegados ===== */
const hasFiles = e => [...(e.dataTransfer?.types || [])].includes('Files');
let dragDepth = 0;
window.addEventListener('dragenter', e => { if (!hasFiles(e)) return; dragDepth++; if (curPiece()) document.body.classList.add('file-over'); });
window.addEventListener('dragleave', e => { if (!hasFiles(e)) return; dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) document.body.classList.remove('file-over'); });
window.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
window.addEventListener('drop', e => {
  if (!hasFiles(e)) return;
  e.preventDefault(); dragDepth = 0; document.body.classList.remove('file-over');
  const files = [...e.dataTransfer.files];
  const json = files.find(f => /\.json$/i.test(f.name) || f.type === 'application/json');
  if (json){ openFileObj(json); return; }
  const imgs = files.filter(f => f.type.startsWith('image/'));
  if (imgs.length) addImages(imgs);
  else toast('Ese archivo no es un guion ni una imagen. Arrastra un .json de guiones, o imágenes JPG, PNG o WebP.');
});
document.addEventListener('paste', e => {
  const files = [...(e.clipboardData?.files || [])].filter(f => f.type.startsWith('image/'));
  if (files.length && curPiece()){ e.preventDefault(); addImages(files); }
});

/* ===== Exportar ===== */
function guionMD(p){
  const b = brandOf(p), t = typeInfo(p.type), L = [];
  L.push(`# ${p.title || 'Sin título'}`, '');
  L.push(`- Marca: ${b.name}`, `- Formato: ${t[1]}`, `- Estado: ${stateLabel(p.status)}`, `- Fecha: ${p.date ? cap(longDate(p.date)) + ' de ' + p.date.slice(0, 4) : 'sin fecha'}`);
  if (p.type === 'video') L.push(`- Voz en off estimada: ${durOf(totalVoiceWords(p))}`);
  L.push('');
  p.sections.forEach((s, i) => {
    L.push(`## ${i + 1}. ${s.title || sectionWord(p.type) + ' ' + (i + 1)}`, '');
    s.blocks.forEach(bk => {
      if (!bk.text.trim()) return;
      L.push(`**${kindLabel(p.type, bk.kind)}:** ${bk.text.trim().replace(/\n/g, '  \n')}`, '');
    });
  });
  if (p.caption.trim() || p.hashtags.trim()){
    L.push('## Texto de la publicación', '');
    if (p.caption.trim()) L.push(p.caption.trim(), '');
    if (p.hashtags.trim()) L.push(p.hashtags.trim(), '');
  }
  if (p.links.length || p.images.length){
    L.push('## Material', '');
    p.links.forEach(l => L.push(`- ${l.note ? l.note + ': ' : ''}${l.url}`));
    p.images.forEach(im => L.push(`- Imagen: ${im.name}`));
    L.push('');
  }
  return L.join('\n');
}

function voiceTXT(p){
  const parts = p.sections.map(s => s.blocks.filter(b => b.kind === 'voz' && b.text.trim()).map(b => b.text.trim()).join('\n\n')).filter(Boolean);
  return [(p.title || 'Sin título').toUpperCase(), '', parts.join('\n\n\n')].join('\n') + '\n';
}

function planMD(){
  const y = ui.month.getFullYear(), m = ui.month.getMonth(), prefix = `${y}-${pad(m + 1)}`;
  const vis = visiblePieces();
  const b = ui.brand !== 'all' ? data.brands.find(x => x.id === ui.brand) : null;
  const line = p => `- ${typeInfo(p.type)[1]}: ${p.title || 'Sin título'} (${stateLabel(p.status).toLowerCase()})${b ? '' : ', ' + brandOf(p).name}`;
  const L = [`# Plan de contenido de ${MONTHS[m]} de ${y}`, '', `Marca: ${b ? b.name : 'todas'}`, ''];
  let cur = '';
  for (const p of sortPieces(vis.filter(p => p.date && p.date.startsWith(prefix)))){
    if (p.date !== cur){ if (cur) L.push(''); cur = p.date; L.push(`## ${cap(longDate(p.date))}`, ''); }
    L.push(line(p));
  }
  const undated = sortPieces(vis.filter(p => !p.date));
  if (undated.length){ L.push('', '## Sin fecha', ''); undated.forEach(p => L.push(line(p))); }
  return L.join('\n') + '\n';
}

function listMD(){
  const vis = visiblePieces();
  const b = ui.brand !== 'all' ? data.brands.find(x => x.id === ui.brand) : null;
  const line = p => `- ${typeInfo(p.type)[1]}: ${p.title || 'Sin título'} (${p.date ? cap(longDate(p.date)) : 'sin fecha'})${b ? '' : ', ' + brandOf(p).name}`;
  const L = ['# Guiones', '', `Marca: ${b ? b.name : 'todas'}`, ''];
  const week = vis.filter(isThisWeek).sort((x, y) => x.date.localeCompare(y.date));
  if (week.length){ L.push('## Para esta semana', ''); week.forEach(p => L.push(line(p))); L.push(''); }
  for (const [st, label] of [['produccion','Producción'],['guion','Guion'],['idea','Ideas'],['programada','Programada'],['publicada','Publicada']]){
    const ps = sortList(vis.filter(p => !isThisWeek(p) && p.status === st));
    if (!ps.length) continue;
    L.push(`## ${label}`, ''); ps.forEach(p => L.push(line(p))); L.push('');
  }
  return L.join('\n');
}

async function downloadCopy(){
  const rev = store.rev;
  try {
    const pieces = [];
    for (const p of data.pieces){
      const images = [];
      for (const im of p.images) images.push({id:im.id, name:im.name, w:im.w, h:im.h, data:im.data || await toDataURL(await imgSrc(im))});
      pieces.push({...p, images});
    }
    download('guiones-koru.json', JSON.stringify({version:1, brands:data.brands, pieces, prompts:data.prompts, notes:data.notes}, null, 1), 'application/json');
    if (store.mode === 'local'){ store.savedRev = rev; store.lastSaved = new Date(); renderStorage(); }
  } catch (err){
    console.error('No se pudo preparar la copia:', err);
    toast(`No pude preparar la copia: ${err.message}. Revisa tu conexión y vuelve a intentarlo.`);
  }
}

/* ===== GitHub ===== */
function gh(path, {method = 'GET', body, accept} = {}){
  const c = store.cfg;
  const headers = {'Authorization':`Bearer ${c.token}`, 'Accept':accept || 'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28'};
  if (body) headers['Content-Type'] = 'application/json';
  return fetch(`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}${path}`, {method, headers, body:body ? JSON.stringify(body) : undefined, cache:'no-store'});
}

async function ghError(res, action){
  let detail = '';
  try { detail = (await res.json()).message || ''; } catch (err){ detail = `respuesta ilegible (${err.message})`; }
  const base = res.status === 401 ? 'La llave no es válida o expiró. Crea una nueva en GitHub y conéctate otra vez.'
    : res.status === 403 ? 'La llave no tiene permiso para escribir en ese repositorio. Revisa que tenga «Contents: Read and write».'
    : res.status === 404 ? 'No encuentro el repositorio, o la llave no tiene acceso a él. Revisa el usuario, el nombre y los permisos de la llave.'
    : `GitHub respondió con un error al ${action}.`;
  return new Error(`${base}${detail ? ` (GitHub: ${detail})` : ''}`);
}

async function loadRemote(){
  const r = await gh('/contents/' + FILE);
  if (r.status === 404) return null;
  if (!r.ok) throw await ghError(r, 'leer tus guiones');
  const j = await r.json();
  store.sha = j.sha;
  let text;
  if (j.encoding === 'base64' && j.content) text = fromB64(j.content);
  else {
    const r2 = await gh('/contents/' + FILE, {accept:'application/vnd.github.raw'});
    if (!r2.ok) throw await ghError(r2, 'leer tus guiones');
    text = await r2.text();
  }
  try { return JSON.parse(text); }
  catch (err){ throw new Error(`El archivo ${FILE} de GitHub está dañado (${err.message}). Revisa su historial en GitHub para recuperar una versión anterior.`); }
}

function serialize(){
  return JSON.stringify({version:1, brands:data.brands, pieces:data.pieces.map(p => ({...p, images:p.images.map(({data:d, ...rest}) => rest.path ? rest : {...rest, data:d})})), prompts:data.prompts, notes:data.notes}, null, 1);
}

async function connect(owner, repo, token){
  store.cfg = {owner, repo, token};
  const r = await gh('');
  if (!r.ok) throw await ghError(r, 'conectar');
  const info = await r.json();
  if (!info.private) throw new Error('Ese repositorio es público y tus guiones quedarían a la vista de cualquiera. Hazlo privado en GitHub o usa koru-datos.');
  store.sha = null;
  const remote = await loadRemote();
  const hasLocal = data.pieces.length > 0;
  store.mode = 'github';
  if (remote && Array.isArray(remote.pieces) && remote.pieces.length && hasLocal){
    if (confirm('En GitHub ya hay guiones guardados.\n\nAceptar: traer los de GitHub y descartar los de esta pestaña.\nCancelar: subir los de esta pestaña y reemplazar los de GitHub.')){ applyData(remote); store.rev++; store.savedRev = store.rev; }
    else store.rev++;
  } else if (remote && !hasLocal){ applyData(remote); store.rev++; store.savedRev = store.rev; }
  else store.rev++;
  try { localStorage.setItem(CFG_KEY, JSON.stringify(store.cfg)); }
  catch (err){ console.warn('No se pudo recordar la conexión:', err); toast('Conectado, pero este navegador no deja recordar la llave. Tendrás que pegarla de nuevo la próxima vez.'); }
  store.loaded = true; store.state = 'idle'; store.lastSaved = null;
  ui.connectOpen = false; ui.connectError = '';
  render();
  if (isDirty()) saveNow();
}

function scheduleSave(){ clearTimeout(store.timer); store.timer = setTimeout(saveNow, 1200); }

async function saveNow(){
  if (store.mode !== 'github'){ downloadCopy(); return; }
  clearTimeout(store.timer); store.timer = null;
  if (!store.loaded || store.state === 'conflict' || store.state === 'loading') return;
  if (store.saving){ store.again = true; return; }
  if (!isDirty() && !store.pendingDeletes.length) return;
  store.saving = true; store.state = 'saving'; renderStorage();
  const rev = store.rev;
  try {
    for (const p of data.pieces) for (const im of p.images){
      if (im.path || !im.data) continue;
      const path = `${MEDIA}${im.id}.jpg`;
      const r = await gh('/contents/' + encodePath(path), {method:'PUT', body:{message:`Imagen para «${p.title || 'Sin título'}»`, content:im.data.split(',')[1]}});
      if (!r.ok && r.status !== 422) throw await ghError(r, 'subir una imagen');
      im.path = path; imgCache.set(im.id, im.data); delete im.data;
    }
    while (store.pendingDeletes.length){
      const path = store.pendingDeletes[0];
      const g = await gh('/contents/' + encodePath(path));
      if (g.ok){
        const j = await g.json();
        const d = await gh('/contents/' + encodePath(path), {method:'DELETE', body:{message:'Quita imagen', sha:j.sha}});
        if (!d.ok && d.status !== 404) console.warn(`No se pudo borrar ${path} en GitHub (estado ${d.status}). Queda en el repositorio sin usarse.`);
      }
      store.pendingDeletes.shift();
    }
    const payload = {message:'Actualiza guiones', content:toB64(serialize())};
    if (store.sha) payload.sha = store.sha;
    const r = await gh('/contents/' + FILE, {method:'PUT', body:payload});
    if (r.status === 409 || r.status === 422){ store.state = 'conflict'; console.warn('Conflicto al guardar:', r.status, await r.text()); return; }
    if (!r.ok) throw await ghError(r, 'guardar');
    const j = await r.json();
    store.sha = j.content.sha; store.savedRev = rev; store.lastSaved = new Date(); store.state = 'idle';
  } catch (err){
    if (err instanceof TypeError){
      console.warn('Sin conexión al guardar:', err);
      store.state = 'offline'; clearTimeout(store.retry); store.retry = setTimeout(() => { store.state = 'idle'; saveNow(); }, 15000);
    } else { console.error('Error al guardar:', err); store.state = 'error'; store.errorMsg = err.message; }
  } finally {
    store.saving = false; renderStorage();
    if (store.again){ store.again = false; if (store.state === 'idle' && isDirty()) saveNow(); }
    else if (store.state === 'idle' && isDirty()) scheduleSave();
  }
}

async function pullRemote(ask){
  if (ask && isDirty() && !confirm('Traer la versión de GitHub descarta los cambios de esta pestaña que no se guardaron. ¿Continuar?')) return;
  store.state = 'loading'; renderStorage();
  try {
    const remote = await loadRemote();
    applyData(remote || emptyData());
    store.rev++; store.savedRev = store.rev; store.loaded = true; store.state = 'idle'; store.lastSaved = new Date();
    if (!remote){ store.rev++; }
    render();
    if (isDirty()) saveNow();
  } catch (err){
    console.error('No se pudo traer de GitHub:', err);
    store.state = 'error';
    store.errorMsg = err instanceof TypeError ? 'No hay conexión con GitHub. Revisa tu internet y pulsa Reintentar.' : err.message;
    renderStorage();
  }
}
const startupLoad = () => pullRemote(false);

window.addEventListener('online', () => { if (store.mode === 'github' && store.state === 'offline'){ store.state = 'idle'; saveNow(); } });

/* ===== Teclado y cierre ===== */
window.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's'){ e.preventDefault(); saveNow(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key === '.'){ e.preventDefault(); toggleFocus(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter'){
    if (ui.space === 'textos' && curPrompt()){
      e.preventDefault();
      if (ui.promptView === 'edit'){ ui.promptView = 'read'; renderCenter(); }
      else { const b = $('#copyPrompt'); if (b) copyPrompt(b); }
      return;
    }
    const aid = document.activeElement?.id;
    if (ui.space === 'textos' && (aid === 'bankCapture' || aid === 'capTopic')){ e.preventDefault(); saveCapture(); return; }
  }
  if (e.key === 'Escape'){
    if (!lightbox.hidden){ lightbox.hidden = true; return; }
    if (ui.space === 'textos' && curPrompt() && ui.promptView === 'read'){ ui.promptView = 'edit'; renderCenter(); return; }
    if (ui.focus && isEditorView()){ toggleFocus(); return; }
    const tag = document.activeElement?.tagName;
    if (ui.view === 'cal' && ui.piece && tag !== 'INPUT' && tag !== 'TEXTAREA' && tag !== 'SELECT'){ ui.piece = null; render(); }
  }
});
window.addEventListener('beforeunload', e => { if (isDirty()){ e.preventDefault(); e.returnValue = ''; } });

const todayText = new Date().toLocaleDateString('es', {weekday:'long', day:'numeric', month:'long'});
$('#today').textContent = todayText.charAt(0).toLocaleUpperCase('es') + todayText.slice(1);

/* ===== Arranque ===== */
let saved = null;
try { saved = JSON.parse(localStorage.getItem(CFG_KEY) || 'null'); } catch (err){ console.warn('No se pudo leer la conexión guardada:', err); }
if (saved && saved.owner && saved.repo && saved.token){
  store.mode = 'github'; store.cfg = saved; store.state = 'loading';
  render();
  startupLoad();
} else {
  render();
}
})();
</script>

</template>

<script>
(() => {
'use strict';
const TITLES = {tareas:'Tareas', planner:'Planner', textos:'Textos'};
const frames = {};
const win = name => frames[name] ? frames[name].contentWindow : null;
let pending = false, readyQueue = [];

function mount(name, label){
  const tpl = document.getElementById('app-' + name);
  const f = document.createElement('iframe');
  f.title = label;
  f.setAttribute('allow', 'clipboard-read; clipboard-write');
  f.srcdoc = '<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head><body>'
    + tpl.innerHTML + '</body></html>';
  document.body.appendChild(f);
  frames[name] = f;
}
function show(name){ for (const [k, f] of Object.entries(frames)) f.classList.toggle('on', k === name); }

window.KoruHub = {
  go(space){
    if (!TITLES[space]) return;
    const frame = space === 'tareas' ? 'tareas' : 'escritorio';
    show(frame);
    if (frame === 'escritorio'){
      const app = win('escritorio') && win('escritorio').KoruApp;
      if (app) app.setSpace(space); else readyQueue.push(() => win('escritorio').KoruApp.setSpace(space));
    }
    document.title = TITLES[space] + ' | Koru KSVT';
    try { win(frame).focus(); } catch (err){ console.warn('No se pudo enfocar el espacio:', err); }
  },
  tracker(){ const w = win('tareas'); return w && w.KoruTracker ? w.KoruTracker : null; },
  trackerChanged(){
    if (pending) return;
    pending = true;
    requestAnimationFrame(() => {
      pending = false;
      const w = win('escritorio');
      if (w && w.KoruApp) w.KoruApp.trackerChanged();
    });
  },
  openPiece(id){ this.go('planner'); const w = win('escritorio'); if (w && w.KoruApp) w.KoruApp.openPiece(id); },
  openTasks(clientId, projectId){ this.go('tareas'); const t = this.tracker(); if (t) t.open(clientId, projectId); }
};

mount('tareas', 'Tareas');
mount('escritorio', 'Planner y Textos');
frames.escritorio.addEventListener('load', () => { readyQueue.splice(0).forEach(fn => fn()); });
KoruHub.go('tareas');
})();
</script>
