<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi seguimiento · KSVT</title>
<style>
/* ===== KSVT 1.1 · Primitivas (paleta intacta) ===== */
:root{
  --gray-900:#1d1d1d;--gray-850:#232323;--gray-800:#2e2e2e;--gray-750:#383838;--gray-700:#404040;
  --gray-600:#4c4c4c;--gray-500:#818181;--gray-400:#a1a1a1;--gray-300:#b4b4b4;--gray-100:#d6d6d6;--white:#ffffff;
  --orange-300:#ff8f78;--orange-400:#f56b50;--orange-500:#e8543a;--orange-600:#c94328;--orange-700:#b83f2a;--orange-950:#2a0d07;
  --green-500:#8fb46a;--green-950:#16210c;
  --red-surface:#3a2323;--red-on-surface:#f0c0b6;
}
/* ===== KSVT 1.1 · Semánticas ===== */
:root{
  --surface-sunken:var(--gray-850);--surface-canvas:var(--gray-800);--surface-panel:var(--gray-750);
  --surface-raised:var(--gray-700);--surface-hover:var(--gray-600);
  --border-default:var(--gray-900);--border-strong:var(--gray-600);--border-accent:var(--orange-700);
  --text-primary:var(--gray-100);--text-secondary:var(--gray-300);--text-tertiary:var(--gray-400);
  --text-on-accent:var(--white);--text-accent:var(--orange-300);
  --accent:var(--orange-500);--accent-hover:var(--orange-400);--accent-fill:var(--orange-600);
  --accent-wash:rgba(232,84,58,.08);--accent-glow:rgba(232,84,58,.35);
  --status-success:var(--green-500);--status-on-success:var(--green-950);
  --status-danger-surface:var(--red-surface);--status-danger-text:var(--red-on-surface);
  --focus-ring:0 0 0 2px var(--accent);--focus-offset:1px;
  --space-1:4px;--space-2:6px;--space-3:10px;--space-4:14px;--space-5:20px;--space-6:28px;
  --radius:2px;--radius-pill:999px;--border-width:1px;--border:var(--border-width) solid var(--border-default);
  --font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-weight-regular:400;--font-weight-strong:600;
  --duration-instant:80ms;--duration-fast:120ms;--duration-move:140ms;--duration-fade:180ms;
  --ease-move:cubic-bezier(.2,.8,.3,1);--press-scale:.97;
  --shadow-float:0 10px 28px rgba(0,0,0,.45);
}
/* ===== Variante «Refugio» (solo este producto) =====
   Paleta KSVT sin cambios. Cambian forma, aire, tipografía y profundidad:
   esquinas redondeadas, superficies suaves, más espacio y tipografía del sistema. */
:root{
  --surface-canvas:var(--gray-850);
  --surface-panel:var(--gray-800);
  --surface-card:var(--gray-800);
  --surface-raised:var(--gray-750);
  --surface-sunken:var(--gray-900);
  --surface-soft:rgba(255,255,255,.06);
  --surface-soft-hover:rgba(255,255,255,.1);
  --surface-selected:rgba(232,84,58,.15);
  --surface-overlay:rgba(12,12,12,.6);
  --border-soft:rgba(255,255,255,.07);
  --progress-track:rgba(255,255,255,.1);

  --font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,"Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-size-support:12px;
  --font-size-label:13px;
  --font-size-action:14px;
  --font-size-body:15px;
  --font-size-card-title:16px;
  --font-size-title:34px;
  --font-size-figure:46px;
  --line-height:1.5;

  --space-7:40px;
  --space-8:56px;

  --radius:8px;
  --radius-md:10px;
  --radius-lg:14px;
  --radius-xl:18px;

  --control-height:36px;
  --control-height-compact:28px;
  --control-padding:8px 14px;
  --panel-width-left:340px;
  --panel-width-right:288px;
  --content-max-width:830px;

  --bar-hero:10px;
  --bar-row:6px;
  --bar-tree:4px;
  --check-size:22px;
  --avatar-sm:22px;
  --avatar-lg:56px;

  --shadow-card:0 1px 2px rgba(0,0,0,.28);
  --shadow-active:0 1px 3px rgba(0,0,0,.4);
}

/* ===== Base ===== */
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  background:var(--surface-canvas);color:var(--text-primary);
  font:var(--font-weight-regular) var(--font-size-body)/var(--line-height) var(--font-family);
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
button,input{font:inherit;color:inherit;}
:focus-visible{outline:none;box-shadow:var(--focus-ring);outline-offset:var(--focus-offset);}
[hidden]{display:none !important;}
svg{display:block;}

/* Barras de desplazamiento: invisibles en reposo, finas al pasar el cursor */
*{scrollbar-width:thin;scrollbar-color:transparent transparent;}
*:hover{scrollbar-color:rgba(255,255,255,.16) transparent;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent;}
::-webkit-scrollbar-thumb{background:transparent;border:3px solid transparent;border-radius:999px;background-clip:content-box;}
:hover::-webkit-scrollbar-thumb{background-color:rgba(255,255,255,.16);}
::-webkit-scrollbar-thumb:hover{background-color:rgba(255,255,255,.3);}
body.is-dragging,body.is-dragging *{cursor:grabbing !important;user-select:none;}

.shell{display:grid;grid-template-columns:var(--panel-width-left) 1fr var(--panel-width-right);height:100%;}
.col{display:flex;flex-direction:column;overflow:hidden;background:var(--surface-panel);}
.col-left{border-right:1px solid var(--border-soft);}
.col-right{border-left:1px solid var(--border-soft);overflow-y:auto;}
.center{position:relative;display:flex;background:var(--surface-canvas);overflow:hidden;}

.section{padding:var(--space-4) var(--space-4);}
.section-title,.side-head h2{
  margin:0 0 var(--space-2);padding:0 var(--space-2);
  font-size:var(--font-size-support);font-weight:var(--font-weight-strong);color:var(--text-tertiary);
}
.side-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-2);}
.side-head h2{margin:0;}
.grow{flex:1;min-height:0;overflow-y:auto;padding-top:0;}

.brand{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-5) var(--space-5) var(--space-2);}
.brand-mark{
  width:30px;height:30px;border-radius:9px;flex:none;
  background:var(--accent-fill);color:var(--text-on-accent);
  display:flex;align-items:center;justify-content:center;font-size:var(--font-size-support);font-weight:700;
}
.brand-text{display:flex;flex-direction:column;min-width:0;}
.brand-name{font-size:var(--font-size-action);font-weight:var(--font-weight-strong);line-height:1.3;}
.brand-date{font-size:var(--font-size-support);color:var(--text-tertiary);line-height:1.3;}
.brand-sys{margin-left:auto;align-self:flex-start;font-size:var(--font-size-support);color:var(--text-tertiary);}

.help{margin:var(--space-2) 0 0;font-size:var(--font-size-support);color:var(--text-tertiary);line-height:1.45;}

/* ===== Botones ===== */
.b{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);
  height:var(--control-height);padding:var(--control-padding);
  background:var(--surface-soft);color:var(--text-primary);
  border:none;border-radius:var(--radius-md);
  font-size:var(--font-size-action);font-weight:var(--font-weight-strong);
  cursor:pointer;user-select:none;white-space:nowrap;
  transition:background var(--duration-fast),transform var(--duration-fast),box-shadow var(--duration-fast);
}
.b:hover{background:var(--surface-soft-hover);}
.b:active{transform:scale(var(--press-scale));}
.b.go{background:var(--accent-fill);color:var(--text-on-accent);}
.b.go:hover{background:var(--accent-hover);box-shadow:0 4px 14px var(--accent-glow);}
.b.pill{border-radius:var(--radius-pill);}
.b.wide{width:100%;}
.b.tall{height:calc(var(--control-height) + var(--space-1));}
.b:disabled{opacity:.45;cursor:not-allowed;pointer-events:none;}

.ib{
  display:inline-flex;align-items:center;justify-content:center;flex:none;
  width:var(--control-height-compact);height:var(--control-height-compact);padding:0;
  background:transparent;border:none;border-radius:var(--radius);
  color:var(--text-tertiary);cursor:pointer;font-size:var(--font-size-action);line-height:1;
  transition:background var(--duration-fast),color var(--duration-fast);
}
.ib:hover{background:var(--surface-soft-hover);color:var(--text-primary);}
.ib.danger:hover{background:var(--status-danger-surface);color:var(--status-danger-text);}
.ib:disabled{opacity:.25;pointer-events:none;}

.link{
  background:none;border:none;padding:0;cursor:pointer;border-radius:4px;
  color:var(--text-secondary);font-size:var(--font-size-label);
}
.link:hover{color:var(--text-primary);text-decoration:underline;text-underline-offset:3px;}
.link.quiet{color:var(--text-tertiary);font-size:var(--font-size-support);}
.link.quiet:hover{color:var(--text-primary);}

.field{
  display:flex;align-items:center;flex:1;min-width:0;height:var(--control-height);
  background:var(--surface-sunken);border:1px solid var(--border-soft);border-radius:var(--radius-md);
  transition:border-color var(--duration-fast),box-shadow var(--duration-fast);
}
.field input{
  flex:1;min-width:0;height:100%;padding:0 var(--space-3);
  background:transparent;border:none;color:var(--text-primary);font-size:var(--font-size-body);
}
.field input::placeholder{color:var(--text-tertiary);}
.field input:focus,.field input:focus-visible{outline:none;box-shadow:none;}
.field:focus-within{border-color:var(--border-accent);box-shadow:var(--focus-ring);}
.row{display:flex;align-items:center;gap:var(--space-2);}

/* Chevron de expandir y contraer */
.chev{
  display:inline-flex;align-items:center;justify-content:center;flex:none;
  width:20px;height:20px;padding:0;border:none;border-radius:6px;background:transparent;
  color:var(--text-tertiary);cursor:pointer;transition:background var(--duration-fast),color var(--duration-fast);
}
.chev:hover{background:var(--surface-soft-hover);color:var(--text-primary);}
.chev svg{transform:rotate(90deg);transition:transform var(--duration-fade) var(--ease-move);}
.collapsed > * > .chev svg,.chev[aria-expanded="false"] svg{transform:rotate(0deg);}
.chev.hidden{visibility:hidden;}

/* Avatar: emoji o inicial */
.avatar{
  display:inline-flex;align-items:center;justify-content:center;flex:none;
  width:var(--avatar-sm);height:var(--avatar-sm);border-radius:6px;
  background:var(--surface-soft);font-size:var(--font-size-label);line-height:1;
}
.avatar.initial{color:var(--text-secondary);font-weight:var(--font-weight-strong);font-size:var(--font-size-support);}
.avatar.emoji{background:transparent;font-size:var(--font-size-body);}

/* ===== Barras de avance ===== */
.bar{display:block;height:var(--bar-tree);background:var(--progress-track);border-radius:var(--radius-pill);overflow:hidden;}
.bar.row{height:var(--bar-row);}
.bar.big{height:var(--bar-hero);}
.bar i{display:block;height:100%;border-radius:var(--radius-pill);background:var(--accent);transition:width var(--duration-fade) var(--ease-move);}
.bar.done i{background:var(--status-success);}
.segbar{display:flex;gap:4px;height:var(--bar-hero);}
.segbar i{flex:1;min-width:3px;background:var(--progress-track);border-radius:var(--radius-pill);transition:background var(--duration-fade);}
.segbar i.on{background:var(--accent);}
.segbar.done i{background:var(--status-success);}

/* ===== Panel izquierdo: nuevo cliente ===== */
.new-client-card{
  padding:var(--space-4);background:var(--surface-canvas);
  border:1px solid var(--border-soft);border-radius:var(--radius-lg);
}
.new-client-card .section-title{padding:0;margin-bottom:var(--space-3);}
.plus{font-size:18px;line-height:1;font-weight:var(--font-weight-regular);margin-top:-2px;}

.emoji-btn{
  display:inline-flex;align-items:center;justify-content:center;flex:none;
  width:var(--control-height);height:var(--control-height);padding:0;
  background:var(--surface-sunken);border:1px solid var(--border-soft);border-radius:var(--radius-md);
  font-size:var(--font-size-body);line-height:1;cursor:pointer;
  transition:background var(--duration-fast),border-color var(--duration-fast);
}
.emoji-btn:hover{background:var(--surface-soft-hover);}
.emoji-btn.empty{color:var(--text-tertiary);font-size:var(--font-size-card-title);}
.emoji-btn.lg{
  width:var(--avatar-lg);height:var(--avatar-lg);border-radius:var(--radius-lg);
  background:var(--surface-card);font-size:30px;box-shadow:var(--shadow-card);
}
.emoji-btn.lg.empty{font-size:22px;font-weight:var(--font-weight-strong);color:var(--text-secondary);}

/* ===== Árbol de clientes ===== */
#tree{position:relative;}
.tree-client{margin-bottom:var(--space-2);}
.tree-client.dragging{opacity:.35;}
.tree-line{left:var(--space-1);right:var(--space-1);}
.tree-row{
  display:flex;align-items:center;gap:2px;padding:0 var(--space-1) 0 var(--space-1);
  min-height:34px;border-radius:var(--radius);
  transition:background var(--duration-fast);
}
.tree-row:hover{background:var(--surface-soft);}
.tree-row.active{background:var(--surface-selected);}
.tree-main{
  flex:1;min-width:0;display:flex;align-items:center;gap:var(--space-3);
  height:38px;padding:0 var(--space-1);background:transparent;border:none;border-radius:var(--radius);
  text-align:left;cursor:pointer;color:var(--text-primary);touch-action:none;
}
.tree-main .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--font-size-body);font-weight:700;}
.tree-row .pct{font-size:var(--font-size-support);font-variant-numeric:tabular-nums;color:var(--text-tertiary);}
.tree-row .pct.done{color:var(--status-success);}
.tree-row.active .pct{color:var(--text-accent);}
.tree-row .add-proj{opacity:0;width:24px;height:24px;transition:opacity var(--duration-fast),background var(--duration-fast);}
.tree-row:hover .add-proj,.tree-row:focus-within .add-proj{opacity:1;}
@media (hover:none){.tree-row .add-proj{opacity:1;}}

.tree-children{display:grid;grid-template-rows:1fr;transition:grid-template-rows var(--duration-fade) var(--ease-move);}
.tree-children > div{overflow:hidden;min-height:0;position:relative;}
.tree-children > div::before{content:"";position:absolute;left:23px;top:var(--space-1);bottom:var(--space-1);width:1px;background:var(--border-soft);}
.tree-client.collapsed .tree-children{grid-template-rows:0fr;}
.tree-proj{
  display:grid;grid-template-columns:1fr auto;align-items:start;column-gap:var(--space-3);row-gap:8px;
  width:100%;padding:var(--space-3) var(--space-3) var(--space-3) 38px;margin:1px 0;
  background:transparent;border:none;border-radius:var(--radius);
  text-align:left;cursor:pointer;color:var(--text-secondary);
  transition:background var(--duration-fast),color var(--duration-fast);
}
.tree-proj:hover{background:var(--surface-soft);color:var(--text-primary);}
.tree-proj.active{background:var(--surface-selected);color:var(--text-primary);}
.tree-proj .name{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:var(--font-size-action);line-height:1.35;}
.tree-proj .bar{grid-column:1 / -1;}
.tree-proj .pct{display:inline-flex;align-items:center;gap:var(--space-2);padding-top:1px;white-space:nowrap;font-size:var(--font-size-support);font-variant-numeric:tabular-nums;color:var(--text-tertiary);}
.tree-proj .pct.done{color:var(--status-success);}
.tree-proj.active .pct{color:var(--text-accent);}
.tree-empty{padding:var(--space-2) var(--space-3) var(--space-2) 38px;font-size:var(--font-size-support);color:var(--text-tertiary);}

/* ===== Lienzo ===== */
.scroll{flex:1;overflow-y:auto;}
.view{max-width:calc(var(--content-max-width) + 2 * clamp(var(--space-6), 4vw, var(--space-8)));margin:0 auto;padding:var(--space-8) clamp(var(--space-6), 4vw, var(--space-8)) calc(var(--space-8) * 2);}

.crumb{
  display:inline-flex;align-items:center;gap:var(--space-2);
  height:30px;padding:0 var(--space-3) 0 var(--space-1);margin-left:calc(-1 * var(--space-1));
  background:transparent;border:none;border-radius:var(--radius-pill);
  color:var(--text-secondary);font-size:var(--font-size-label);cursor:pointer;
  transition:background var(--duration-fast),color var(--duration-fast);
}
.crumb:hover{background:var(--surface-soft);color:var(--text-primary);}
.crumb .back{color:var(--text-tertiary);}
.kicker{font-size:var(--font-size-label);color:var(--text-tertiary);}

.head{display:flex;align-items:center;gap:var(--space-4);margin-top:var(--space-4);}
.title-input{
  flex:1;min-width:0;padding:var(--space-1) var(--space-2);margin-left:calc(-1 * var(--space-2));
  background:transparent;border:none;border-radius:var(--radius-md);
  color:var(--text-primary);font-size:var(--font-size-title);font-weight:700;letter-spacing:-.02em;
  transition:background var(--duration-fast);
}
.head .emoji-btn + .title-input{margin-left:0;}
.title-input:hover{background:var(--surface-soft);}
.title-input:focus,.title-input:focus-visible{outline:none;background:var(--surface-soft);box-shadow:var(--focus-ring);}

/* Tarjeta de avance */
.hero{
  margin-top:var(--space-6);padding:var(--space-6);
  background:var(--surface-card);border:1px solid var(--border-soft);border-radius:var(--radius-xl);
  box-shadow:var(--shadow-card);
}
.hero-top{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--space-5);margin-bottom:var(--space-5);}
.figure{font-size:var(--font-size-figure);font-weight:700;line-height:.9;letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--text-primary);}
.figure small{font-size:20px;font-weight:var(--font-weight-strong);color:var(--text-tertiary);margin-left:3px;letter-spacing:0;}
.figure.done{color:var(--status-success);}
.figure.empty{color:var(--text-tertiary);}
.hero-right{text-align:right;}
.hero-remaining{font-size:var(--font-size-card-title);color:var(--text-primary);font-variant-numeric:tabular-nums;}
.hero-remaining strong{font-weight:700;color:var(--text-accent);}
.hero-remaining.ok{color:var(--status-success);font-weight:var(--font-weight-strong);}
.hero-remaining.empty{color:var(--text-secondary);}
.hero-sub{margin-top:2px;font-size:var(--font-size-label);color:var(--text-tertiary);font-variant-numeric:tabular-nums;}

.block{margin-top:var(--space-7);}
.block-head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);margin-bottom:var(--space-3);}
.block-title{margin:0;font-size:var(--font-size-card-title);font-weight:var(--font-weight-strong);}
.note{margin:var(--space-3) 0 0;font-size:var(--font-size-label);color:var(--text-tertiary);line-height:1.55;}

/* Control segmentado */
.seg{display:inline-flex;gap:2px;padding:3px;background:var(--surface-sunken);border-radius:var(--radius-md);}
.seg button{
  height:28px;padding:0 var(--space-3);border:none;border-radius:7px;background:transparent;
  color:var(--text-secondary);font-size:var(--font-size-label);cursor:pointer;
  transition:background var(--duration-fast),color var(--duration-fast);
}
.seg button:hover{color:var(--text-primary);}
.seg button.active{background:var(--surface-raised);color:var(--text-primary);box-shadow:var(--shadow-active);}
.seg .n{font-variant-numeric:tabular-nums;color:var(--text-tertiary);margin-left:4px;}
.seg button.active .n{color:var(--text-secondary);}

/* Casilla redonda */
.circle{
  position:relative;flex:none;width:var(--check-size);height:var(--check-size);padding:0;
  border-radius:50%;border:1.5px solid var(--gray-500);background:transparent;cursor:pointer;
  transition:background var(--duration-fast),border-color var(--duration-fast),transform var(--duration-fast);
}
.circle::after{
  content:"";position:absolute;left:50%;top:46%;width:5px;height:10px;
  border:solid transparent;border-width:0 2px 2px 0;transform:translate(-50%,-50%) rotate(45deg);
}
.circle:hover{border-color:var(--accent);}
.circle:hover::after{border-color:var(--gray-500);}
.circle:active{transform:scale(.9);}
.circle[aria-checked="true"]{background:var(--status-success);border-color:var(--status-success);}
.circle[aria-checked="true"]::after{border-color:var(--status-on-success);}

/* Tareas */
.tasks-wrap{position:relative;}
.tasks{list-style:none;margin:0;padding:0;}
.task{
  display:flex;align-items:flex-start;gap:var(--space-3);min-height:44px;padding:5px var(--space-2) 5px 0;
  border-radius:var(--radius-md);background:var(--surface-canvas);
  transition:background var(--duration-fast);
}
.task:hover{background:var(--surface-soft);}
.task.dragging{opacity:.35;}
.handle{
  flex:none;width:18px;align-self:stretch;display:flex;align-items:center;justify-content:center;
  color:var(--text-tertiary);cursor:grab;touch-action:none;user-select:none;letter-spacing:-3px;font-size:var(--font-size-label);
  opacity:0;transition:opacity var(--duration-fast);
}
.task:hover .handle{opacity:1;}
.handle:hover{color:var(--text-primary);}
.task-text{
  flex:1;min-width:0;min-height:34px;padding:6px var(--space-2);margin:0;
  background:transparent;border:none;border-radius:var(--radius);resize:none;overflow:hidden;

<script>
(function(){
'use strict';

/* ---------- Constantes y utilidades ---------- */
const APP = 'koru-seguimiento';
const VERSION = 1;
const DEFAULT_NAME = 'seguimiento-koru.json';
const FILE_TYPES = [{description:'Archivo de seguimiento', accept:{'application/json':['.json']}}];
const SEGMENT_LIMIT = 40;
const CHEV = '<svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const EMOJIS = ['🏦','🏢','🏭','🏪','🏥','🏫','🏨','🛒',
                '☕','🍔','🍕','🍷','🎨','🖌️','✏️','📐',
                '📷','🎬','🎧','🎮','💻','📱','🚗','🏍️',
                '✈️','🚀','🌱','🌿','🌸','🐾','⚽','🎵',
                '📚','💡','🔧','⚙️','💼','📦','🧩','⭐',
                '❤️','🔥','💎','🟠','🔵','🟢','🟣','⚫'];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-5);
const now = () => new Date().toISOString();
const hhmm = d => d.toLocaleTimeString('es', {hour:'2-digit', minute:'2-digit'});
const plural = (n, one, many) => n + ' ' + (n === 1 ? one : many);

function firstGrapheme(s){
  s = String(s || '').trim();
  if (!s) return '';
  if (typeof Intl !== 'undefined' && Intl.Segmenter){
    const it = new Intl.Segmenter(undefined, {granularity:'grapheme'}).segment(s)[Symbol.iterator]().next();
    return it.done ? '' : it.value.segment;
  }
  return Array.from(s)[0];
}
const LEADING_EMOJI = /^((?:\p{Extended_Pictographic}|\p{Regional_Indicator})(?:\uFE0F|\p{Emoji_Modifier}|\p{Regional_Indicator}|\u200D\p{Extended_Pictographic}\uFE0F?)*)\s*/u;
function splitEmoji(name){
  const m = String(name).match(LEADING_EMOJI);
  return m ? {emoji: m[1], name: name.slice(m[0].length).trim()} : {emoji:'', name: String(name).trim()};
}
const urgentLabel = n => plural(n, 'urgente', 'urgentes');
function hostOf(url){
  try{ return new URL(url).hostname.replace(/^www\./, ''); } catch(err){ return String(url); }
}
function normalizeUrl(raw){
  let v = String(raw).trim();
  if (!/^[a-z][a-z0-9+.-]*:/i.test(v)) v = 'https://' + v;
  let u;
  try{ u = new URL(v); } catch(err){ return null; }
  if (u.protocol !== 'http:' && u.protocol !== 'https:') return null;
  if (!u.hostname.includes('.') && u.hostname !== 'localhost') return null;
  return u.href;
}
function fitText(el){ el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }
const initialOf = name => (firstGrapheme(name) || '·').toLocaleUpperCase('es');
function avatar(c){
  return c.emoji
    ? `<span class="avatar emoji" aria-hidden="true">${esc(c.emoji)}</span>`
    : `<span class="avatar initial" aria-hidden="true">${esc(initialOf(c.name))}</span>`;
}

/* Guardado directo en disco (Chrome, Edge). La capacidad se confirma al usarla;
   si falla, se pasa a descargar el archivo. */
const disk = {
  save: typeof window.showSaveFilePicker === 'function',
  open: typeof window.showOpenFilePicker === 'function'
};

/* ---------- Estado ---------- */
let data = null;
let rev = 0, savedRev = 0;
const ui = {
  clientId:null, projectId:null, filter:'all',
  handle:null, fileName:null, canAutosave:false,
  saving:false, savedAt:null, downloaded:false,
  newClientOpen:false, newEmoji:'',
  expanded:new Set(),  // tarjetas de proyecto abiertas en la vista de cliente
  linkFormFor:null     // proyecto con el formulario de enlace abierto
};
const isDirty = () => !!data && rev !== savedRev;

/* ---------- Avance ---------- */
function stats(tasks){
  const total = tasks.length;
  const done = tasks.filter(t => t.done).length;
  const pct = total === 0 ? null : (done === total ? 100 : Math.floor(done / total * 100));
  const urgent = tasks.filter(t => t.urgent && !t.done).length;
  return {total, done, pending: total - done, pct, urgent};
}
const projStats = p => stats(p.tasks);
function clientStats(c){
  const s = stats(c.projects.flatMap(p => p.tasks));
  s.projects = c.projects.length;
  s.finished = c.projects.filter(p => projStats(p).pct === 100).length;
  return s;
}
const pctText = pct => pct === null ? '' : pct + ' %';
const findClient = id => data && data.clients.find(c => c.id === id) || null;
function current(){
  const c = findClient(ui.clientId);
  const p = c && c.projects.find(x => x.id === ui.projectId) || null;
  return {c, p};
}
const findProject = (c, pid) => c && c.projects.find(p => p.id === pid) || null;
function visibleTasks(p){
  if (ui.filter === 'pending') return p.tasks.filter(t => !t.done);
  if (ui.filter === 'done') return p.tasks.filter(t => t.done);
  return p.tasks;
}
function ensureSelection(){
  if (!data || !data.clients.length){ ui.clientId = null; ui.projectId = null; return; }
  let c = findClient(ui.clientId);
  if (!c){
    c = data.clients[0];
    ui.clientId = c.id;
    ui.projectId = c.projects[0] ? c.projects[0].id : null;
  } else if (ui.projectId && !c.projects.some(p => p.id === ui.projectId)){
    ui.projectId = null;
  }
}

/* ---------- Piezas ---------- */
function progressBar(done, total, size){
  const all = total > 0 && done === total;
  const label = total ? `${done} de ${total} tareas hechas` : 'Sin tareas';
  if (size === 'seg' && total > 0 && total <= SEGMENT_LIMIT){
    let segs = '';
    for (let i = 0; i < total; i++) segs += `<i class="${i < done ? 'on' : ''}"></i>`;
    return `<span class="segbar ${all ? 'done' : ''}" role="img" aria-label="${label}">${segs}</span>`;
  }
  const width = total ? (done / total * 100) : 0;
  const cls = size === 'row' ? 'row' : (size === 'sm' ? '' : 'big');
  return `<span class="bar ${cls} ${all ? 'done' : ''}" role="img" aria-label="${label}"><i style="width:${width}%"></i></span>`;
}
function figure(s){
  if (s.pct === null) return `<span class="figure empty">0<small>%</small></span>`;
  return `<span class="figure ${s.pct === 100 ? 'done' : ''}">${s.pct}<small>%</small></span>`;
}
function heroRemaining(s){
  if (!s.total) return '<div class="hero-remaining empty">Sin tareas todavía</div>';
  if (s.pct === 100) return '<div class="hero-remaining ok">Finalizado</div>';
  return `<div class="hero-remaining">Faltan <strong>${s.pending}</strong> de ${plural(s.total, 'tarea', 'tareas')}</div>`;
}

/* ---------- Render ---------- */
function render(){ ensureSelection(); renderTree(); renderCenter(); renderSide(); renderNewClient(); }

function changed(opts){
  rev++;
  data.updatedAt = now();
  if (!opts || opts.center !== false) renderCenter();
  renderTree();
  renderSide();
  scheduleSave();
}

function renderNewClient(){
  const open = ui.newClientOpen || (!!data && !data.clients.length);
  $('#newClientBtn').hidden = open;
  $('#newClientForm').hidden = !open;
  $('#cancelClient').hidden = !!data && !data.clients.length;
  const eb = $('#newClientEmoji');
  eb.textContent = ui.newEmoji || '＋';
  eb.classList.toggle('empty', !ui.newEmoji);
}

function renderTree(){
  const el = $('#tree');
  const ta = $('#toggleAll');
  if (!data || !data.clients.length){
    ta.hidden = true;
    el.innerHTML = `<p class="help" style="margin:0;padding:0 var(--space-2)">${data ? 'Todavía no hay clientes.' : 'Abre tu archivo de seguimiento o empieza uno nuevo.'}</p>`;
    return;
  }
  updateToggleAll();
  el.innerHTML = data.clients.map(c => {
    const cs = clientStats(c);
    const cActive = ui.clientId === c.id && !ui.projectId;
    const hasProjects = c.projects.length > 0;
    const projects = c.projects.map(p => {
      const ps = projStats(p), done = ps.pct === 100;
      const dot = ps.urgent ? `<span class="urgent-dot" title="${urgentLabel(ps.urgent)}"></span>` : '';
      return `<button class="tree-proj ${ui.projectId === p.id ? 'active' : ''}" data-client="${c.id}" data-project="${p.id}">
        <span class="name">${esc(p.name)}</span>
        <span class="pct ${done ? 'done' : ''}">${dot}${ps.total ? pctText(ps.pct) : 'Sin tareas'}</span>
        ${progressBar(ps.done, ps.total, 'sm')}
      </button>`;
    }).join('');
    return `<div class="tree-client ${c.collapsed ? 'collapsed' : ''}" data-box="${c.id}">
      <div class="tree-row ${cActive ? 'active' : ''}">
        <button class="chev ${hasProjects ? '' : 'hidden'}" data-toggle="${c.id}" aria-expanded="${!c.collapsed}" title="${c.collapsed ? 'Mostrar proyectos' : 'Ocultar proyectos'}">${CHEV}</button>
        <button class="tree-main" data-client="${c.id}" title="Arrastra para cambiar el orden (o Alt + ↑ ↓)">
          ${avatar(c)}<span class="name">${esc(c.name)}</span>
          <span class="pct ${cs.pct === 100 ? 'done' : ''}">${pctText(cs.pct)}</span>
        </button>
        <button class="ib add-proj" data-add-project="${c.id}" title="Añadir proyecto a ${esc(c.name)}">+</button>
      </div>
      <div class="tree-children"><div>${projects || ''}</div></div>
    </div>`;
  }).join('') + '<div class="insert-line tree-line"></div>';
}

function updateToggleAll(){
  const ta = $('#toggleAll');
  const withProjects = data ? data.clients.filter(c => c.projects.length) : [];
  ta.hidden = withProjects.length < 2;
  ta.textContent = withProjects.some(c => !c.collapsed) ? 'Contraer todo' : 'Expandir todo';
}

function renderCenter(){
  const el = $('#center');
  if (ui.view === 'connect'){ el.innerHTML = connectView(); return; }
  if (ui.remote === 'loading'){
    el.innerHTML = '<div class="state-view"><h1 class="welcome-title">Cargando tus datos…</h1><p class="welcome-text">Leyendo tu repositorio privado en GitHub.</p></div>';
    return;
  }
  if (ui.remote === 'error'){
    el.innerHTML = `<div class="state-view">
      <h1 class="welcome-title">No pude cargar tus datos</h1>
      <p class="welcome-text">GitHub dijo: ${esc(ui.remoteError || 'error desconocido')}. Revisa tu conexión a internet o la llave, y vuelve a intentarlo.</p>
      <div class="row"><button class="b go" data-act="gh-retry">Reintentar</button><button class="b" data-act="gh-open">Revisar la conexión</button></div>
    </div>`;
    return;
  }
  if (!data){
    el.innerHTML = `<div class="welcome">
      <h1 class="welcome-title">¿Cuánto falta para terminar?</h1>
      <p class="welcome-text">Tu espacio personal para ordenar clientes, proyectos y tareas, y ver de un vistazo cuánto te falta en cada uno.</p>
      <div class="dropzone" id="drop" role="button" tabindex="0" data-act="open-file">
        <span class="dz-main">Arrastra aquí tu archivo de seguimiento</span>
        <span class="dz-sub">o haz clic para buscarlo en tu equipo</span>
      </div>
      <div class="row"><button class="b go" data-act="gh-open">Conectar con GitHub</button><button class="link" data-act="new-file" style="margin-left:var(--space-3)">Empezar un archivo nuevo</button></div>
      <p class="help" style="margin:0">Con GitHub, tus datos viven en un repositorio privado tuyo y los ves desde cualquier navegador. Con un archivo, quedan solo en tu equipo.</p>
    </div>`;
    return;
  }
  const {c, p} = current();
  if (!c){
    el.innerHTML = `<div class="welcome">
      <h1 class="welcome-title">Empieza por un cliente</h1>
      <p class="welcome-text">Escribe su nombre en el panel de la izquierda. Dentro de cada cliente se crean los proyectos y, dentro de cada proyecto, sus tareas.</p>
    </div>`;
    return;
  }
  el.innerHTML = p ? projectView(c, p) : clientView(c);
  el.querySelectorAll('textarea.task-text').forEach(fitText);
}

function clientView(c){
  const s = clientStats(c);
  const idx = data.clients.indexOf(c);
  const sub = s.projects
    ? `${s.finished} de ${plural(s.projects, 'proyecto finalizado', 'proyectos finalizados')}`
    : 'Crea un proyecto para empezar a medir';
  const cards = c.projects.map(p => {
    const ps = projStats(p), pd = ps.pct === 100, open = ui.expanded.has(p.id);
    const subTxt = !ps.total ? 'Sin tareas todavía' : (pd ? 'Finalizado' : `Faltan ${ps.pending} de ${ps.total}`);
    const tasks = p.tasks.map(t => `<li class="mtask ${t.done ? 'done' : ''}" data-pid="${p.id}" data-tid="${t.id}">
        <button class="circle" role="checkbox" aria-checked="${t.done}" data-act="toggle" title="${t.done ? 'Marcar como pendiente' : 'Marcar como hecha'}"></button>
        <span class="mtext">${esc(t.text)}</span>
        ${t.urgent && !t.done ? '<span class="tag-urgent sm">Urgente</span>' : ''}</li>`).join('');
    return `<div class="pcard ${open ? 'open' : ''}" data-card="${p.id}">
      <div class="pcard-head">
        <button class="chev" data-expand="${p.id}" aria-expanded="${open}" title="${open ? 'Ocultar tareas' : 'Ver tareas'}">${CHEV}</button>
        <button class="pcard-main" data-open="${p.id}">
          <span class="pcard-title">${esc(p.name)}</span>
          <span class="pcard-sub ${pd ? 'ok' : ''}">${subTxt}</span>
        </button>
        <span class="pcard-pct ${pd ? 'ok' : ''} ${ps.total ? '' : 'empty'}">${ps.urgent ? `<span class="tag-urgent sm">${urgentLabel(ps.urgent)}</span>` : ''}${ps.total ? pctText(ps.pct) : ''}</span>
      </div>
      <div class="pcard-bar">${progressBar(ps.done, ps.total, 'row')}</div>
      <div class="pcard-body"><div><div class="pcard-inner">
        ${tasks ? `<ul class="mtasks">${tasks}</ul>` : '<p class="note" style="margin:var(--space-2) 0">Este proyecto aún no tiene tareas.</p>'}
        <button class="link" data-open="${p.id}">Abrir proyecto</button>
      </div></div></div>
    </div>`;
  }).join('');
  return `<div class="view">
    <div class="kicker-row">
      <span class="kicker">Cliente</span>
      <span class="row" style="gap:2px">
        <button class="ib" data-act="client-up" title="Subir este cliente en la lista" ${idx === 0 ? 'disabled' : ''}>↑</button>
        <button class="ib" data-act="client-down" title="Bajar este cliente en la lista" ${idx === data.clients.length - 1 ? 'disabled' : ''}>↓</button>
      </span>
    </div>
    <div class="head">
      <button class="emoji-btn lg ${c.emoji ? '' : 'empty'}" id="clientEmoji" data-act="client-emoji" title="${c.emoji ? 'Cambiar emoji' : 'Añadir emoji'}">${c.emoji ? esc(c.emoji) : esc(initialOf(c.name))}</button>
      <input id="title" class="title-input" data-kind="client" value="${esc(c.name)}" aria-label="Nombre del cliente" spellcheck="false" autocomplete="off">
    </div>
    <div class="hero">
      <div class="hero-top">${figure(s)}<div class="hero-right">${heroRemaining(s)}<div class="hero-sub">${sub}</div>${s.urgent ? `<span class="tag-urgent">${urgentLabel(s.urgent)}</span>` : ''}</div></div>
      ${progressBar(s.done, s.total, 'hero')}
    </div>
    <div class="block">
      <div class="block-head"><h2 class="block-title">Proyectos</h2></div>
      ${cards ? `<div class="pcards">${cards}</div>` : ''}
      <div class="row new-project">
        <span class="field"><input id="newProject" placeholder="Nombre del proyecto nuevo" autocomplete="off" aria-label="Nombre del proyecto nuevo"></span>
        <button class="b" data-act="add-project">Añadir proyecto</button>
      </div>
    </div>
    <div class="danger-zone"><button class="link danger-link" data-act="del-client">Eliminar cliente</button></div>
  </div>`;
}

function linksBlock(p){
  const formOpen = ui.linkFormFor === p.id;
  const cards = p.links.map(l => `<div class="link-card">
      <a class="link-main" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer" title="${esc(l.url)}">
        <span class="link-ico" aria-hidden="true">${esc(initialOf(l.title))}</span>
        <span class="link-txt"><span class="link-title">${esc(l.title)}</span><span class="link-host">${esc(hostOf(l.url))}</span></span>
      </a>
      <button class="ib link-del" data-act="del-link" data-link="${l.id}" title="Quitar enlace">✕</button>
    </div>`).join('');
  const form = formOpen ? `<div class="link-form">
      <span class="field"><input id="linkUrl" placeholder="Pega la dirección, por ejemplo figma.com/file/…" autocomplete="off" aria-label="Dirección del enlace"></span>
      <span class="field"><input id="linkName" placeholder="Nombre para reconocerlo (opcional)" autocomplete="off" aria-label="Nombre del enlace"></span>
      <div class="row"><button class="b go" data-act="link-add">Guardar enlace</button><button class="b" data-act="link-cancel">Cancelar</button></div>
    </div>` : '';
  const hint = !cards && !formOpen
    ? '<p class="note" style="margin:0">Lo que abres siempre en este proyecto: el Figma, la carpeta de Drive, el brief.</p>' : '';
  return `<div class="block">
    <div class="block-head"><h2 class="block-title">Enlaces</h2>${formOpen ? '' : '<button class="link" data-act="link-open">+ Añadir enlace</button>'}</div>
    ${cards ? `<div class="links">${cards}</div>` : ''}${hint}${form}
  </div>`;
}

function projectView(c, p){
  const s = projStats(p);
  const tasks = visibleTasks(p);
  const counts = {all: s.total, pending: s.pending, done: s.done};
  const seg = (key, label) =>
    `<button class="${ui.filter === key ? 'active' : ''}" data-filter="${key}" aria-pressed="${ui.filter === key}">${label}<span class="n">${counts[key]}</span></button>`;
  const sub = !s.total ? 'Escribe la primera tarea abajo' : `${s.done} de ${plural(s.total, 'tarea hecha', 'tareas hechas')}`;
  let empty = '';
  if (s.total && !tasks.length) empty = `<p class="note">${ui.filter === 'pending' ? 'No queda nada pendiente.' : 'Todavía no hay tareas hechas.'}</p>`;
  return `<div class="view">
    <button class="crumb" data-act="crumb" title="Ver todos los proyectos de este cliente"><span class="back" aria-hidden="true">‹</span>${avatar(c)}<span>${esc(c.name)}</span></button>
    <div class="head">
      <input id="title" class="title-input" data-kind="project" value="${esc(p.name)}" aria-label="Nombre del proyecto" spellcheck="false" autocomplete="off">
    </div>
    <div class="hero">
      <div class="hero-top">${figure(s)}<div class="hero-right">${heroRemaining(s)}<div class="hero-sub">${sub}</div>${s.urgent ? `<span class="tag-urgent">${urgentLabel(s.urgent)}</span>` : ''}</div></div>
      ${progressBar(s.done, s.total, 'seg')}
    </div>
    ${linksBlock(p)}
    <div class="block">
      <div class="block-head">
        <h2 class="block-title">Tareas</h2>
        ${s.total ? `<div class="seg" role="group" aria-label="Mostrar">${seg('all','Todas')}${seg('pending','Pendientes')}${seg('done','Hechas')}</div>` : ''}
      </div>
      <div class="tasks-wrap">
        <ul class="tasks">${tasks.map((t, i) => taskRow(t, i, tasks.length)).join('')}</ul>
        <div class="insert-line"></div>
      </div>
      ${empty}
      <div class="add-line">
        <span class="add-dot" aria-hidden="true">+</span>
        <input id="newTask" placeholder="Añadir una tarea" autocomplete="off" aria-label="Tarea nueva">
        <button class="b go" id="addTaskBtn" data-act="add-task" hidden>Añadir</button>
      </div>
    </div>
    <div class="danger-zone"><button class="link danger-link" data-act="del-project">Eliminar proyecto</button></div>
  </div>`;
}

function taskRow(t, i, n){
  const urgentNow = t.urgent && !t.done;
  return `<li class="task ${t.done ? 'done' : ''}" data-id="${t.id}">
    <span class="handle" title="Arrastra para reordenar" aria-hidden="true">⋮⋮</span>
    <button class="circle" role="checkbox" aria-checked="${t.done}" data-act="toggle" title="${t.done ? 'Marcar como pendiente' : 'Marcar como hecha'}"></button>
    <textarea class="task-text" rows="1" aria-label="Tarea" spellcheck="false">${esc(t.text)}</textarea>
    ${urgentNow ? '<button class="tag-urgent" data-act="urgent" title="Quitar urgente">Urgente</button>' : ''}
    <span class="task-actions">
      <button class="ib ${t.urgent ? 'on' : ''}" data-act="urgent" title="${t.urgent ? 'Quitar urgente' : 'Marcar como urgente'}">!</button>
      <button class="ib" data-act="up" title="Subir" ${i === 0 ? 'disabled' : ''}>↑</button>
      <button class="ib" data-act="down" title="Bajar" ${i === n - 1 ? 'disabled' : ''}>↓</button>
      <button class="ib danger" data-act="del-task" title="Eliminar tarea">✕</button>
    </span>
  </li>`;
}

function statRows(rows){
  return rows.map(([k, v, cls]) => `<div class="stat"><span class="k">${k}</span><span class="v ${cls || ''}">${v}</span></div>`).join('');
}

function renderSide(){
  const {c, p} = current();
  $('#projGroup').hidden = !p;
  if (p){
    const s = projStats(p);
    $('#projStats').innerHTML = statRows([
      ['Faltan', s.pending, s.pending ? 'strong accent' : 'strong'],
      ...(s.urgent ? [['Urgentes', s.urgent, 'strong accent']] : []),
      ['Hechas', s.done], ['Tareas', s.total],
      ['Avance', s.total ? pctText(s.pct) : '0 %', s.pct === 100 ? 'ok strong' : 'strong']
    ]);
  }
  $('#clientGroup').hidden = !c;
  $('#emptyGroup').hidden = !!c;
  if (c){
    const s = clientStats(c);
    $('#clientStats').innerHTML = statRows([
      ['Proyectos', s.projects], ['Finalizados', s.finished, s.projects && s.finished === s.projects ? 'ok' : ''],
      ['Faltan', plural(s.pending, 'tarea', 'tareas')], ['Hechas', s.done],
      ['Avance', s.total ? pctText(s.pct) : '0 %', s.pct === 100 ? 'ok strong' : 'strong']
    ]);
  }

  // El botón de guardar se pinta en naranja solo cuando hay algo que hacer.
  const saveBtn = $('#saveBtn');
  const onGitHub = !!gh.cfg;
  $('#ghBtn').hidden = onGitHub;
  $('#openBtn').hidden = onGitHub;
  $('#newBtn').hidden = onGitHub;
  $('#copyBtn').hidden = !onGitHub || !data;
  $('#disconnectBtn').hidden = !onGitHub;
  $('#fileTitle').textContent = onGitHub ? 'Guardado' : 'Archivo';
  $('#fileKind').textContent = onGitHub ? 'Repositorio privado en GitHub' : '';
  $('#fileKind').hidden = !onGitHub;
  saveBtn.disabled = !data;

  let dot = '', txt = '', help = '', needsAction = false;
  if (onGitHub){
    $('#fileName').textContent = gh.cfg.owner + '/' + gh.cfg.repo;
    $('#saveLabel').textContent = 'Guardar ahora';
    needsAction = !!data && (!!gh.error || gh.offline);
    if (!data){ txt = ui.remote === 'loading' ? 'Cargando…' : ''; }
    else if (ui.saving){ txt = 'Guardando…'; }
    else if (gh.error){ dot = 'dirty'; txt = gh.error.charAt(0).toUpperCase() + gh.error.slice(1); }
    else if (gh.offline){ dot = 'dirty'; txt = 'Sin conexión: se guardará al volver'; }
    else if (isDirty()){ dot = 'dirty'; txt = 'Guardando en un momento…'; }
    else if (ui.savedAt){ dot = 'ok'; txt = 'Guardado a las ' + hhmm(ui.savedAt); }
    else { dot = 'ok'; txt = 'Al día'; }
    help = 'Los cambios se guardan solos en GitHub. Abre esta misma página en otro navegador y conecta la llave para ver tus datos allí.';
  } else {
    const autosaving = !!(ui.handle && ui.canAutosave);
    needsAction = !!data && !autosaving && (isDirty() || (!ui.fileName && data.clients.length > 0));
    $('#saveLabel').textContent = disk.save ? 'Guardar' : 'Descargar archivo';
    $('#fileName').textContent = !data ? 'Ningún archivo abierto' : (ui.fileName || 'Sin guardar todavía');
    if (data){
      if (ui.saving){ txt = 'Guardando…'; }
      else if (isDirty()){ dot = 'dirty'; txt = 'Cambios sin guardar'; }
      else if (ui.savedAt){ dot = 'ok'; txt = (ui.downloaded ? 'Descargado a las ' : 'Guardado a las ') + hhmm(ui.savedAt); }
      else if (ui.fileName){ dot = 'ok'; txt = 'Sin cambios'; }
      if (!disk.save) help = 'Este navegador no puede escribir en tu disco. Al terminar, descarga el archivo y reemplaza el anterior.';
      else if (autosaving) help = 'Los cambios se guardan solos en este archivo.';
      else if (ui.handle) help = 'Pulsa Guardar una vez para que los cambios se guarden solos en este archivo.';
      else help = 'Elige dónde guardar el archivo. Desde ese momento, los cambios se guardan solos.';
    }
  }
  saveBtn.classList.toggle('go', needsAction);
  $('#fileState').innerHTML = txt ? `<span class="dot ${dot}"></span><span>${esc(txt)}</span>` : '';
  $('#fileHelp').textContent = help;
  $('#fileHelp').hidden = !help;
  document.title = (isDirty() ? '● ' : '') + 'Mi seguimiento · KSVT';
}

/* ---------- Acciones ---------- */
function ensureData(){
  if (!data){ data = {app:APP, version:VERSION, clients:[]}; rev = 0; savedRev = 0; }
}
function openNewClient(){ ui.newClientOpen = true; renderNewClient(); $('#newClient').focus(); }
function closeNewClient(){
  ui.newClientOpen = false; ui.newEmoji = '';
  $('#newClient').value = '';
  renderNewClient();
  if (!$('#newClientBtn').hidden) $('#newClientBtn').focus();
}
function addClient(){
  const input = $('#newClient');
  const parts = splitEmoji(input.value);
  if (!parts.name){ input.focus(); return; }
  ensureData();
  const c = {id:uid(), name:parts.name, emoji: ui.newEmoji || parts.emoji, collapsed:false, projects:[]};
  data.clients.push(c);
  ui.clientId = c.id; ui.projectId = null; ui.filter = 'all';
  ui.newClientOpen = false; ui.newEmoji = '';
  input.value = '';
  changed();
  renderNewClient();
  focusSel('#newProject');
}
function addProject(clientId, name){
  const c = findClient(clientId);
  if (!c) return;
  const p = {id:uid(), name: name || 'Proyecto sin nombre', createdAt:now(), links:[], tasks:[]};
  c.projects.push(p);
  c.collapsed = false;
  ui.clientId = c.id; ui.projectId = p.id; ui.filter = 'all';
  changed();
  if (name) focusSel('#newTask');
  else { const t = $('#title'); if (t){ t.focus(); t.select(); } }
}
function addProjectFromInput(){
  const input = $('#newProject');
  const name = input.value.trim();
  if (!name){ input.focus(); return; }
  addProject(ui.clientId, name);
}
function addTask(){
  const {p} = current();
  const input = $('#newTask');
  if (!p || !input) return;
  const text = input.value.trim();
  if (!text){ input.focus(); return; }
  p.tasks.push({id:uid(), text, done:false, urgent:false, createdAt:now(), doneAt:null});
  if (ui.filter === 'done') ui.filter = 'all';
  changed();
  focusSel('#newTask');
}
function toggleTask(pid, id){
  const {c} = current();
  const p = findProject(c, pid);
  const t = p && p.tasks.find(x => x.id === id);
  if (!t) return;
  t.done = !t.done;
  t.doneAt = t.done ? now() : null;
  changed();
  focusSel(`[data-id="${id}"] .circle`) || focusSel(`[data-tid="${id}"] .circle`) || focusSel('#newTask');
}
function moveTask(id, dir){
  const {p} = current();
  if (!p) return;
  const vis = visibleTasks(p).map(t => t.id);
  const i = vis.indexOf(id), j = i + dir;
  if (i < 0 || j < 0 || j >= vis.length) return;
  const a = p.tasks.findIndex(t => t.id === id);
  const b = p.tasks.findIndex(t => t.id === vis[j]);
  [p.tasks[a], p.tasks[b]] = [p.tasks[b], p.tasks[a]];
  changed();
  focusSel(`[data-id="${id}"] [data-act="${dir < 0 ? 'up' : 'down'}"]:not(:disabled)`) ||
    focusSel(`[data-id="${id}"] [data-act="${dir < 0 ? 'down' : 'up'}"]`);
}
function deleteTask(id){
  const {p} = current();
  if (!p) return;
  const vis = visibleTasks(p).map(t => t.id);
  const next = vis[vis.indexOf(id) + 1] || vis[vis.indexOf(id) - 1];
  p.tasks = p.tasks.filter(t => t.id !== id);
  changed();
  (next && focusSel(`[data-id="${next}"] .task-text`)) || focusSel('#newTask');
}
async function deleteProject(){
  const {c, p} = current();
  if (!p) return;
  if (p.tasks.length && !await confirmDialog(
    'Eliminar «' + p.name + '»',
    'Se eliminan también sus ' + plural(p.tasks.length, 'tarea', 'tareas') + '.',
    'Eliminar proyecto')) return;
  c.projects = c.projects.filter(x => x.id !== p.id);
  ui.projectId = null;
  changed();
}
async function deleteClient(){
  const {c} = current();
  if (!c) return;
  const tasks = c.projects.reduce((n, p) => n + p.tasks.length, 0);
  if (c.projects.length && !await confirmDialog(
    'Eliminar «' + c.name + '»',
    'Se eliminan también ' + plural(c.projects.length, 'proyecto', 'proyectos') + ' y ' + plural(tasks, 'tarea', 'tareas') + '.',
    'Eliminar cliente')) return;
  const idx = data.clients.indexOf(c);
  data.clients.splice(idx, 1);
  const next = data.clients[idx] || data.clients[idx - 1];
  ui.clientId = next ? next.id : null;
  ui.projectId = null;
  changed();
  renderNewClient();
}
function toggleUrgent(id){
  const {p} = current();
  const t = p && p.tasks.find(x => x.id === id);
  if (!t) return;
  t.urgent = !t.urgent;
  changed();
  focusSel(`[data-id="${id}"] .task-actions [data-act="urgent"]`);
}
function moveClient(id, dir){
  const i = data.clients.findIndex(c => c.id === id), j = i + dir;
  if (i < 0 || j < 0 || j >= data.clients.length) return;
  [data.clients[i], data.clients[j]] = [data.clients[j], data.clients[i]];
  changed();
}
function openLinkForm(){
  ui.linkFormFor = ui.projectId;
  renderCenter();
  focusSel('#linkUrl');
}
function closeLinkForm(){
  ui.linkFormFor = null;
  renderCenter();
  focusSel('[data-act="link-open"]');
}
function addLink(){
  const {p} = current();
  const urlInput = $('#linkUrl');
  if (!p || !urlInput) return;
  if (!urlInput.value.trim()){ urlInput.focus(); return; }
  const url = normalizeUrl(urlInput.value);
  if (!url){
    toast('Esa dirección no parece un enlace. Revisa que esté completa, por ejemplo figma.com/file/…');
    urlInput.focus();
    return;
  }
  const title = $('#linkName').value.trim() || hostOf(url);
  p.links.push({id:uid(), url, title});
  ui.linkFormFor = null;
  changed();
  focusSel('[data-act="link-open"]');
}
function deleteLink(linkId){
  const {p} = current();
  if (!p) return;
  p.links = p.links.filter(l => l.id !== linkId);
  changed();
}

function focusSel(sel){
  const el = document.querySelector(sel);
  if (el){ el.focus(); return true; }
  return false;
}

/* Contraer y expandir: es una preferencia de vista. Se guarda en el archivo
   junto con el siguiente cambio, pero por sí sola no cuenta como cambio. */
function setCollapsed(c, value){
  c.collapsed = value;
  const box = document.querySelector(`[data-box="${c.id}"]`);
  if (box){
    box.classList.toggle('collapsed', value);
    const chev = box.querySelector('[data-toggle]');
    chev.setAttribute('aria-expanded', String(!value));
    chev.title = value ? 'Mostrar proyectos' : 'Ocultar proyectos';
  }
}

/* ---------- Selector de emoji ---------- */
const pop = $('#emojiPop');
let popCb = null, popAnchor = null;
function openEmoji(anchor, currentEmoji, cb){
  if (!pop.hidden && popAnchor === anchor){ closeEmoji(true); return; }
  popCb = cb; popAnchor = anchor;
  $('#emojiGrid').innerHTML = EMOJIS.map(e =>
    `<button class="emoji-opt ${e === currentEmoji ? 'active' : ''}" data-emoji="${e}" aria-label="${e}">${e}</button>`).join('');
  $('#emojiOther').value = '';
  $('#emojiRemove').hidden = !currentEmoji;
  pop.hidden = false;
  const r = anchor.getBoundingClientRect();
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  const left = Math.max(8, Math.min(r.left, window.innerWidth - pw - 8));
  let top = r.bottom + 8;
  if (top + ph > window.innerHeight - 8) top = Math.max(8, r.top - ph - 8);
  pop.style.left = left + 'px';
  pop.style.top = top + 'px';
  (pop.querySelector('.emoji-opt.active') || pop.querySelector('.emoji-opt')).focus();
}
function closeEmoji(restoreFocus){
  if (pop.hidden) return;
  pop.hidden = true;
  const a = popAnchor;
  popCb = null; popAnchor = null;
  if (restoreFocus && a && document.contains(a)) a.focus();
}
function pickEmoji(e){
  const cb = popCb;
  closeEmoji(false);
  if (cb) cb(e);
}
pop.addEventListener('click', e => {
  const b = e.target.closest('[data-emoji]');
  if (b) pickEmoji(b.dataset.emoji);
});
$('#emojiRemove').addEventListener('click', () => pickEmoji(''));
$('#emojiOther').addEventListener('keydown', e => {
  if (e.key === 'Enter'){ e.preventDefault(); const g = firstGrapheme(e.target.value); if (g) pickEmoji(g); }
});
pop.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ e.preventDefault(); closeEmoji(true); return; }
  const opt = e.target.closest('.emoji-opt');
  if (!opt) return;
  const all = [...pop.querySelectorAll('.emoji-opt')];
  const i = all.indexOf(opt);
  const step = {ArrowRight:1, ArrowLeft:-1, ArrowDown:8, ArrowUp:-8}[e.key];
  if (step !== undefined){ e.preventDefault(); const n = all[i + step]; if (n) n.focus(); }
});
document.addEventListener('mousedown', e => {
  if (pop.hidden) return;
  if (pop.contains(e.target) || (popAnchor && popAnchor.contains(e.target))) return;
  closeEmoji(false);
});

/* ---------- Guardado en GitHub ----------
   Excepción declarada a KSVT: esta herramienta personal guarda en un repositorio
   privado del usuario. La llave se recuerda solo en este navegador. */
const GH_KEY = 'koru-seguimiento:github';
const DATA_PATH = 'seguimiento.json';
const gh = {cfg:null, sha:null, saving:false, again:false, offline:false, error:null, retryTimer:null};

function loadCfg(){
  try{ const raw = localStorage.getItem(GH_KEY); return raw ? JSON.parse(raw) : null; }
  catch(err){ toast('No se pudo leer la conexión guardada (' + err.message + '). Vuelve a conectar GitHub.'); return null; }
}
function storeCfg(cfg){
  try{ localStorage.setItem(GH_KEY, JSON.stringify(cfg)); }
  catch(err){ toast('Este navegador no deja recordar la conexión (' + err.message + '). Tendrás que conectar cada vez que abras la página.'); }
}
function clearCfg(){
  try{ localStorage.removeItem(GH_KEY); }
  catch(err){ toast('No se pudo borrar la llave de este navegador (' + err.message + '). Bórrala desde GitHub para invalidarla.'); }
}
const ghRepoPath = cfg => `/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}`;
const ghContentsPath = cfg => ghRepoPath(cfg) + '/contents/' + DATA_PATH;
function ghHeaders(cfg, extra){
  return Object.assign({
    'Accept':'application/vnd.github+json',
    'Authorization':'Bearer ' + cfg.token,
    'X-GitHub-Api-Version':'2022-11-28'
  }, extra || {});
}
function ghError(message, kind){ const e = new Error(message); e.kind = kind; return e; }
async function ghFetch(cfg, path, opts){
  opts = opts || {};
  try{
    return await fetch('https://api.github.com' + path, {
      method: opts.method || 'GET', cache:'no-store',
      headers: ghHeaders(cfg, opts.body ? {'Content-Type':'application/json'} : (opts.accept ? {'Accept':opts.accept} : null)),
      body: opts.body, keepalive: !!opts.keepalive
    });
  } catch(err){
    throw ghError('no hay conexión con GitHub (' + err.message + ')', 'offline');
  }
}
function b64ToText(b64){
  const bin = atob(String(b64).replace(/\s/g, ''));
  return new TextDecoder().decode(Uint8Array.from(bin, ch => ch.charCodeAt(0)));
}
function textToB64(text){
  const bytes = new TextEncoder().encode(text);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
async function ghReadRepo(cfg){
  const r = await ghFetch(cfg, ghRepoPath(cfg));
  if (r.status === 401) throw ghError('la llave no es válida o ya venció', 'auth');
  if (r.status === 403 || r.status === 404) throw ghError('no encuentro el repositorio «' + cfg.owner + '/' + cfg.repo + '», o la llave no tiene acceso a él', 'access');
  if (!r.ok) throw ghError('GitHub respondió con un error ' + r.status, 'http');
  return r.json();
}
async function ghReadData(cfg){
  const r = await ghFetch(cfg, ghContentsPath(cfg));
  if (r.status === 404) return null;
  if (r.status === 401) throw ghError('la llave no es válida o ya venció', 'auth');
  if (r.status === 403) throw ghError('la llave no tiene permiso para leer el repositorio', 'access');
  if (!r.ok) throw ghError('GitHub respondió con un error ' + r.status + ' al leer tus datos', 'http');
  const j = await r.json();
  let text;
  if (j.content) text = b64ToText(j.content);
  else {
    // Archivos de más de 1 MB llegan sin contenido: se piden en crudo.
    const raw = await ghFetch(cfg, ghContentsPath(cfg), {accept:'application/vnd.github.raw'});
    if (!raw.ok) throw ghError('GitHub respondió con un error ' + raw.status + ' al leer tus datos', 'http');
    text = await raw.text();
  }
  return {sha: j.sha, text};
}
function ghPutBody(text, sha){
  const body = {message:'Actualiza seguimiento', content: textToB64(text)};
  if (sha) body.sha = sha;
  return JSON.stringify(body);
}
async function ghWriteData(cfg, text, sha){
  const r = await ghFetch(cfg, ghContentsPath(cfg), {method:'PUT', body: ghPutBody(text, sha)});
  if (r.status === 409 || r.status === 422) throw ghError('otra versión se guardó desde otro lugar', 'conflict');
  if (r.status === 401) throw ghError('la llave no es válida o ya venció', 'auth');
  if (r.status === 403 || r.status === 404) throw ghError('la llave no tiene permiso para escribir. Revisa que tenga «Contents: Read and write»', 'access');
  if (!r.ok) throw ghError('GitHub respondió con un error ' + r.status + ' al guardar', 'http');
  const j = await r.json();
  return j.content.sha;
}
function applyRemote(remote){
  let parsed;
  try{ parsed = normalize(JSON.parse(remote.text)); }
  catch(err){ throw ghError('el archivo de GitHub no se pudo leer: ' + err.message, 'parse'); }
  data = parsed;
  gh.sha = remote.sha;
  rev++; savedRev = rev;
  ui.savedAt = null;
  ensureSelection();
}
async function ghSave(){
  if (!gh.cfg || !data) return;
  if (gh.saving){ gh.again = true; return; }
  clearTimeout(saveTimer); clearTimeout(gh.retryTimer);
  gh.saving = true; ui.saving = true; renderSide();
  const target = rev;
  try{
    gh.sha = await ghWriteData(gh.cfg, serialize(), gh.sha);
    savedRev = target;
    ui.savedAt = new Date();
    gh.offline = false; gh.error = null;
  } catch(err){
    if (err.kind === 'offline'){
      gh.offline = true;
      gh.retryTimer = setTimeout(ghSave, 20000);
    } else if (err.kind === 'conflict'){
      gh.error = 'Hay otra versión en GitHub';
      gh.saving = false; ui.saving = false;
      await resolveConflict();
      return;
    } else {
      gh.error = err.message;
      toast('No se pudo guardar en GitHub: ' + err.message + '.');
    }
  } finally {
    if (gh.saving){ gh.saving = false; ui.saving = false; renderSide(); }
  }
  if (gh.again || (rev !== savedRev && !gh.error && !gh.offline)){ gh.again = false; scheduleSave(); }
}
async function resolveConflict(){
  renderSide();
  const keepLocal = await confirmDialog(
    'Tus datos cambiaron en otro lugar',
    'Desde que se cargaron aquí, se guardó otra versión en GitHub (quizá desde otro computador). Puedes quedarte con la de este equipo, que reemplaza la otra, o cargar la de GitHub y perder lo que cambiaste aquí desde el último guardado.',
    'Quedarme con esta', 'Cargar la de GitHub');
  if (keepLocal === null) return; // queda pendiente; «Guardar ahora» vuelve a preguntar
  try{
    const remote = await ghReadData(gh.cfg);
    if (keepLocal){
      gh.sha = remote ? remote.sha : null;
      gh.error = null;
      await ghSave();
    } else if (remote){
      applyRemote(remote);
      gh.error = null;
      render();
    }
  } catch(err){
    gh.error = err.message;
    renderSide();
    toast('No se pudo resolver el conflicto: ' + err.message + '. Pulsa «Guardar ahora» para intentarlo de nuevo.');
  }
}
async function startGitHub(){
  ui.remote = 'loading'; render();
  try{
    const remote = await ghReadData(gh.cfg);
    if (remote) applyRemote(remote);
    else { data = {app:APP, version:VERSION, clients:[]}; gh.sha = null; rev = 0; savedRev = 0; }
    ui.remote = null; ui.remoteError = null;
  } catch(err){
    ui.remote = 'error'; ui.remoteError = err.message;
  }
  render();
}
async function refreshFromGitHub(){
  if (!gh.cfg || !data || isDirty() || gh.saving || gh.error) return;
  try{
    const remote = await ghReadData(gh.cfg);
    if (remote && remote.sha !== gh.sha && !isDirty()){ applyRemote(remote); render(); }
  } catch(err){
    if (err.kind === 'offline'){ gh.offline = true; renderSide(); }
  }
}
function openConnect(){ closeEmoji(false); ui.view = 'connect'; renderCenter(); focusSel(gh.cfg || $('#ghOwner') && $('#ghOwner').value ? '#ghToken' : '#ghOwner'); }
function closeConnect(){ ui.view = null; render(); }
async function connectGitHub(){
  const owner = $('#ghOwner').value.trim().replace(/^@/, '');
  const repo = $('#ghRepo').value.trim();
  const token = $('#ghToken').value.trim();
  if (!owner || !repo || !token){ toast('Completa los tres campos para conectar.'); return; }
  const cfg = {owner, repo, token};
  const btn = $('#ghConnectBtn');
  btn.disabled = true; btn.textContent = 'Conectando…';
  try{
    const info = await ghReadRepo(cfg);
    if (!info.private) throw ghError('el repositorio «' + repo + '» es público y cualquiera podría ver tus datos. Cámbialo a privado en Settings → General → Danger Zone y vuelve a conectar', 'public');
    const remote = await ghReadData(cfg);
    const hasLocal = !!data && data.clients.length > 0;
    let useLocal = !remote;
    if (remote && hasLocal){
      const choice = await confirmDialog('Ya hay datos en GitHub',
        'El repositorio ya tiene un archivo de seguimiento. ¿Cuál quieres usar a partir de ahora?',
        'Subir los de este equipo', 'Usar los de GitHub');
      if (choice === null){ btn.disabled = false; btn.textContent = 'Conectar'; return; }
      useLocal = choice;
    }
    gh.cfg = cfg; storeCfg(cfg);
    gh.error = null; gh.offline = false;
    ui.handle = null; ui.canAutosave = false; ui.fileName = null; ui.downloaded = false;
    ui.view = null;
    if (useLocal){
      ensureData();
      gh.sha = remote ? remote.sha : null;
      rev++;
      render();
      await ghSave();
    } else {
      applyRemote(remote);
      render();
    }
  } catch(err){
    toast('No se pudo conectar: ' + err.message + '.');
    if (document.contains(btn)){ btn.disabled = false; btn.textContent = 'Conectar'; }
  }
}
async function disconnectGitHub(){
  const ok = await confirmDialog('Desconectar GitHub',
    'Se borra la llave de este navegador. Tus datos siguen guardados en GitHub y puedes volver a conectar cuando quieras.',
    'Desconectar');
  if (!ok) return;
  if (isDirty()) await ghSave();
  clearCfg();
  gh.cfg = null; gh.sha = null; gh.error = null; gh.offline = false;
  clearTimeout(gh.retryTimer);
  savedRev = rev;
  ui.fileName = null; ui.savedAt = null;
  render();
}
function connectView(){

    <div class="form-card">
